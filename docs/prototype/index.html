  <script>/* Shared offline review ledger. Synthetic identities, contexts, records and files only. */
(() => {
  'use strict';
  const clone=x=>JSON.parse(JSON.stringify(x));
  const users=[
    {id:'demo-tester',name:'合成测试用户',role:'tester',scopes:['orders-test'],status:'active',revision:1},
    {id:'demo-collaborator',name:'合成协作成员',role:'observer',scopes:['orders-test'],status:'active',revision:1},
    {id:'demo-admin',name:'当前合成管理员',role:'access',scopes:['orders-test'],status:'active',revision:1},
    {id:'demo-live-tester',name:'当前对话用户（合成测试人员）',role:'tester',scopes:null,status:'active',revision:1},
    {id:'demo-live-observer',name:'当前对话用户（合成协作成员）',role:'observer',scopes:null,status:'active',revision:1}
  ];
  const records=new Map(),listeners=[],recordListeners=[];let approvalHandler=null;
  const integration={revision:1,mcpSchemaRevision:1,actualCapabilities:'unknown'};
  const memory={id:'demo-memory-1',state:'candidate',mode:'off',sourceAccess:true,revision:1,scope:'orders-test'};
  const subjectId=role=>role==='observer'?'demo-live-observer':'demo-live-tester';
  const subject=role=>clone(users.find(u=>u.id===subjectId(role)));
  const emit=()=>listeners.forEach(fn=>fn());
  function event(s,type){
    s.trace??=[];s.trace.push({id:`demo-chat-${s.id}-event-${s.trace.length+1}`,sequence:s.trace.length+1,type,at:new Date().toISOString()});
  }
  function memoryAllowed(scope){return memory.mode!=='off'&&memory.state==='active'&&memory.sourceAccess&&memory.scope===scope;}
  function prepare(s){
    const owner=subject(s.roleId),model=s.snapshot.models.find(m=>m.id===s.modelId);
    return {id:`demo-context-${s.id}-${s.inputRevision}`,synthetic:true,validUntil:new Date(Date.now()+5*60*1000).toISOString(),turnId:`demo-turn-${s.id}-${s.inputRevision}`,inputRevision:s.inputRevision,
      configurationRevision:s.snapshot.revision,policyRevision:window.ConfigurationPrototype.current().revision,authorizationRevision:owner.revision,
      systemId:s.systemId,environmentId:s.environmentId,modelId:s.modelId,
      modelObservation:'unknown',requestedModel:s.model,actualModelId:null,provider:model?.provider||'unknown',
      runtimeRef:'demo-runtime-readonly',codeSnapshot:'demo-commit-a',deployedCommit:'demo-commit-a',mcpConnectionRef:'demo-tools-readonly',mcpSchemaRevision:integration.mcpSchemaRevision,integrationRevision:integration.revision,mcpCapability:'unknown',
      messageIds:s.messages.map((m,i)=>`demo-chat-${s.id}-message-${i+1}`),
      attachmentNames:s.messages.flatMap(m=>(m.files||[]).map(f=>f.name)),attachmentContentsRead:false,
      memoryRevision:memory.revision,memoryRefs:memoryAllowed(s.environmentId)?[memory.id]:[],
      excludedMemory:memoryAllowed(s.environmentId)?null:memory.mode==='off'?'默认关闭':!memory.sourceAccess?'原来源授权失效':memory.state!=='active'?'未审核启用或已撤销':'环境不匹配'};
  }
  function planCurrent(s,p){
    return !!p&&Date.parse(p.validUntil)>Date.now()&&p.inputRevision===s.inputRevision&&p.modelId===s.modelId&&p.policyRevision===window.ConfigurationPrototype.current().revision&&p.authorizationRevision===subject(s.roleId).revision&&p.memoryRevision===memory.revision&&p.integrationRevision===integration.revision;
  }
  function sourceCurrent(preparation){return !preparation?.memoryRefs.length||memoryAllowed(preparation.environmentId);}
  function sync(s){
    if(!s.locked||!s.messages.length)return;
    const current=s.messages.findLast(m=>m.kind==='result');
    const record={id:'demo-chat-'+s.id,owner:s.subjectId,scope:s.environmentId,title:s.title+'（本次离线对话）',
      status:!sourceCurrent(current?.preparation)?'来源失效待核查':s.verification?.resultRevision===s.latestResultRevision?'已确认':s.phase==='result'?'待验证':s.phase==='permission'?(s.messages.some(m=>m.pendingReview)?'待负责人审批':'待确认'):s.busy?'处理中':'待补充',
      text:s.messages.map(m=>(m.role==='user'?'用户：':'助手：')+(m.kind==='result'&&!sourceCurrent(m.preparation)?'此结果来源已失效，正文隐藏。':m.text)).join('\n\n'),usage:'未上报实际费用 · 无真实调用',
      events:(s.trace||[]).map(e=>e.type),trace:clone(s.trace||[]),
      preparation:clone(current?.preparation||s.preparation||null),binding:clone(s.binding||null),
      resultRevision:s.latestResultRevision||0,verification:clone(s.verification||null),synthetic:true};
    if(JSON.stringify(records.get(record.id))!==JSON.stringify(record)){records.set(record.id,record);recordListeners.forEach(fn=>fn());}
  }
  function artifact(s,m){
    const csv='\uFEFF来源,报表金额_EUR,明细金额_EUR,差额_EUR\n离线合成示例_非业务结果,128450,125920,'+(128450-125920)+'\n';
    return {id:`demo-chat-${s.id}-artifact-${m.resultRevision}`,name:`合成差异示例-结果${m.resultRevision}.csv`,content:csv,
      mime:'text/csv;charset=utf-8',resultRevision:m.resultRevision,contextRef:m.preparation.id,synthetic:true};
  }
  window.ReviewJourney={users,subjectId,subject,event,prepare,planCurrent,sourceCurrent,sync,artifact,
    approve(id,contextRef){return approvalHandler?approvalHandler(id,contextRef):{ok:false,reason:'没有待处理的计划'};},setApprovalHandler(fn){approvalHandler=fn;},records:()=>clone([...records.values()]),subscribeRecords(fn){recordListeners.push(fn);},memory:()=>clone(memory),memoryAllowed,
    updateMemory(patch){Object.assign(memory,patch);memory.revision++;emit();},
    integrationChanged(reason){integration.revision++;if(reason==='schema')integration.mcpSchemaRevision++;emit();},integration:()=>clone(integration),
    userChanged(){emit();},subscribe(fn){listeners.push(fn);}
  };
})();
</script>
  <script>/* Synthetic configuration shared by the offline admin and chat previews. Not an API or ACL service. */
(() => {
  'use strict';
  const clone = x => JSON.parse(JSON.stringify(x));
  const initial = {
    revision:1,
    systems:[
      {id:'orders',name:'订单系统',owner:'订单测试组',description:'订单、明细与报表核对',enabled:true,prompts:['核对报表与明细差异','排查接口异常','分析错误日志']},
      {id:'payments',name:'支付系统',owner:'支付测试组',description:'支付请求、回调与异常定位',enabled:true,prompts:['排查接口异常','分析错误日志']},
      {id:'reports',name:'报表系统',owner:'数据测试组',description:'报表口径与数据差异检查',enabled:true,prompts:['核对报表与明细差异','分析错误日志']}
    ],
    environments:[
      {id:'orders-test',system:'orders',name:'测试环境',enabled:true,defaultModel:'general'},
      {id:'orders-stage',system:'orders',name:'预发环境',enabled:true,defaultModel:'general'},
      {id:'payments-test',system:'payments',name:'测试环境',enabled:true,defaultModel:'general'},
      {id:'payments-integration',system:'payments',name:'联调环境',enabled:true,defaultModel:'general'},
      {id:'reports-test',system:'reports',name:'测试环境',enabled:true,defaultModel:'general'},
      {id:'reports-stage',system:'reports',name:'预发环境',enabled:true,defaultModel:'general'}
    ],
    models:[
      {id:'general',name:'默认模型',provider:'control',agent:'示例 Agent A',enabled:true},
      {id:'analysis',name:'分析模型',provider:'direct',agent:'示例 Agent B',enabled:true}
    ],
    roles:[
      {id:'tester',name:'测试人员',canApproveRead:true,environments:['orders-test','orders-stage','payments-test','payments-integration','reports-test','reports-stage'],models:['general','analysis'],attachments:true,download:true,history:true,events:true,approver:'测试负责人',maxCalls:10,concurrency:1},
      {id:'observer',name:'协作成员',canApproveRead:false,environments:['orders-test'],models:['general'],attachments:false,download:false,history:true,events:false,approver:'测试负责人',maxCalls:3,concurrency:1}
    ]
  };
  let published=clone(initial), draft=clone(initial), previewRole='tester';
  const audit=[],listeners=[];
  const current = () => clone(published);
  function visible(config=published,roleId=previewRole,applySubject=true) {
    const subject=applySubject?window.ReviewJourney.subject(roleId):null;
    const role=config.roles.find(x=>x.id===(subject?.role||roleId));
    const models=config.models.filter(x=>x.enabled&&role?.models.includes(x.id)&&(!subject||subject.status==='active'));
    const environments=config.environments.filter(x=>x.enabled&&role?.environments.includes(x.id)&&(!subject||subject.status==='active'&&(!subject.scopes||subject.scopes.includes(x.id)))&&config.systems.some(s=>s.id===x.system&&s.enabled));
    const systems=config.systems.filter(x=>x.enabled&&environments.some(e=>e.system===x.id));
    return clone({role,models,environments,systems});
  }
  function errors(config=draft) {
    const messages=[];
    for(const [key,label] of [['systems','系统'],['models','模型'],['environments','环境']]){
      const names=new Set();
      for(const item of config[key]){
        const name=item.name.trim(),identity=(key==='environments'?item.system+':':'')+name;
        if(!name||name.length>40)messages.push(label+'名称须为 1–40 字。');
        if(names.has(identity))messages.push(label+'名称重复：'+name);names.add(identity);
      }
    }
    for(const sys of config.systems)if(!sys.owner.trim())messages.push(sys.name+'需要负责人。');
    for(const env of config.environments){
      if(!config.systems.some(x=>x.id===env.system))messages.push('环境所属系统不存在。');
      if(env.enabled&&config.systems.some(x=>x.id===env.system&&x.enabled)&&!config.models.some(x=>x.id===env.defaultModel&&x.enabled))messages.push(env.name+'的默认模型未启用。');
    }
    for(const role of config.roles){
      if(!role.approver.trim())messages.push(role.name+'需要审批责任人。');
      if(!Number.isInteger(role.maxCalls)||role.maxCalls<1||role.maxCalls>100)messages.push('单轮调用上限须为 1–100 的整数。');
      if(!Number.isInteger(role.concurrency)||role.concurrency<1||role.concurrency>5)messages.push('并发上限须为 1–5 的整数。');
      const v=visible(config,role.id,false);
      for(const env of v.environments)if(!v.models.some(m=>m.id===env.defaultModel))messages.push(role.name+'无权使用 '+env.name+' 的默认模型。');
    }
    return [...new Set(messages)];
  }
  function changes(){
    const labels={systems:'系统',environments:'环境',models:'模型',roles:'权限'};
    const result=[];
    for(const key of Object.keys(labels))for(const item of draft[key]){
      const old=published[key].find(x=>x.id===item.id);
      if(JSON.stringify(old)!==JSON.stringify(item))result.push(`${labels[key]} · ${item.name}（${item.id}）`);
    }
    return result;
  }
  function access(session){
    const subject=window.ReviewJourney.subject(session.roleId);
    if(subject.status!=='active')return '当前用户已暂停，不能继续检查或读取历史内容。';
    const v=visible(published,session.roleId);
    if(!v.environments.some(x=>x.id===session.environmentId&&x.system===session.systemId)||!v.models.some(x=>x.id===session.modelId))return '当前系统、环境或模型已停用，或不在你的权限范围。请联系管理员，或新建对话选择可用范围。';
    return '';
  }
  window.ReviewJourney.subscribe(()=>listeners.forEach(fn=>fn()));
  window.ConfigurationPrototype={
    current, draft:()=>draft, visible, errors, changes, access,
    role:()=>previewRole,
    setRole(id){if(!published.roles.some(x=>x.id===id))return;previewRole=id;listeners.forEach(fn=>fn());},
    subscribe(fn){listeners.push(fn);},
    discard(){draft=clone(published);},
    publish(){const issues=errors();if(issues.length)return {ok:false,errors:issues};const changed=changes();if(!changed.length)return {ok:false,errors:['没有待应用的改动。']};published=clone(draft);published.revision++;draft=clone(published);audit.unshift({revision:published.revision,actor:'合成配置管理员',at:new Date().toISOString(),changes:changed});listeners.forEach(fn=>fn());return {ok:true,revision:published.revision};},
    audit:()=>clone(audit)
  };
})();
</script>

  const audit=[];
  let page='integrations',actor='config',scenario='unknown',notice='',preflight=null,userId='demo-tester',userDraft=null,recordId='demo-record-1',query='',lease=null,leaseDrafts={},memoryState='candidate',leaseTimer=null;

  const toggle=(label,key,value)=>`<label class="admin-toggle"><span>${label}</span><input type="checkbox" data-service-field="${key}" ${value?'checked':''}></label>`;
  function log(action,target){audit.unshift({action,target,actor:roles[actor],at:new Date().toISOString()});}
  function navigation(active){return `<aside class="admin-sidebar"><a class="admin-brand" href="#admin-systems">◈ 平台管理</a><a class="admin-back" href="#chat">← 返回用户对话</a><div class="admin-nav-title">对话配置</div><nav class="admin-config-nav">${[['systems','系统配置'],['environments','环境配置'],['models','模型配置'],['permissions','权限配置']].map(([id,name])=>`<a href="#admin-${id}">${name}</a>`).join('')}</nav><div class="admin-nav-title service-nav-title">接入与治理</div><nav class="admin-service-nav">${Object.entries(pages).map(([id,[name]])=>`<a href="#admin-${id}" ${id===active?'aria-current="page"':''}>${name}</a>`).join('')}</nav><div class="admin-secondary"><a href="#contract">设计与契约评审 ↗</a><a href="#approval">审批恢复演练 ↗</a><small>初始设计 · 离线演示<br>无真实接入与身份服务</small></div></aside>`;}
  function integrations(){return `<div class="service-three"><section class="service-card"><h2>模型访问</h2><p class="admin-muted">用户显示名来自模型预设，账号与密钥方式另行管理。</p>${select('账号管理方式','auth',settings.auth,[['agent_managed','Agent / 总控自行管理'],['secret_ref','受控宿主按引用注入']])}<dl><dt>凭据</dt><dd>${settings.auth==='agent_managed'?'只保存外部认证状态，不复制账号秘密':'仅保存秘密引用；原型无秘密值'}</dd><dt>数据出口</dt><dd>限定区域与服务目录；实际策略待验证</dd><dt>实际模型</dt><dd>未知，不能凭显示名称推断能力</dd></dl></section><section class="service-card"><h2>ACP 执行连接</h2>${select('协议支持分支','acpVersion',settings.acpVersion,[['v1','v1 · 当前设计基线'],['v2-draft','v2 · Draft，未准入']])}<dl><dt>生命周期</dt><dd>初始化 → 认证 → 新会话 → 事件 → 核查 / 停止</dd><dt>恢复与权限桥</dt><dd>逐能力发现；当前未验证</dd><dt>拥有者</dt><dd>固定 Binding，不透明切换后端</dd></dl></section><section class="service-card"><h2>MCP 工具连接</h2>${select('协议版本','mcpVersion',settings.mcpVersion,[['2026-07-28','2026-07-28'],['2025-11-25','2025-11-25 · 兼容分支']])}${select('传输','transport',settings.transport,[['streamable-http','Streamable HTTP'],['stdio','受控 stdio 子进程']])}<p class="admin-muted">两个 HTTP 版本的会话与流语义不同；不混用。工具清单、参数、风险、身份与预算分别检查。</p><span class="service-state">真实工具能力：未知</span></section></div><section class="service-card"><h2>接入条件预检</h2><p class="admin-muted">本地模拟策略检查，不探测端点，不安装或启动进程。</p>${select('演示故障','scenario',scenario,[['unknown','实际能力未知'],['schema','MCP schema 发生变化'],['bridge','审批桥接缺失'],['auth','认证已过期'],['scope','工具参数越界'],['timeout','工具调用结果未知'],['normal','设计条件齐全，仍待实测']])}${button('preflight','运行离线预检','class="admin-primary"')}${button('simulate-admission-change','模拟变更使当前计划失效')}<div id="service-preflight" role="status">${preflight?esc(preflight):'尚未运行预检。'}</div></section>`;}
  function runtime(){return `<div class="service-two"><section class="service-card"><h2>Agent 运行档案</h2><p class="admin-muted">业务环境：订单 / 测试。宿主模板：受控单 Agent。实际制品与隔离证据尚未配置。</p>${select('网络出口','network',settings.network,[['allowlist','仅登记的模型 / 资源服务'],['unrestricted','任意网络 · 禁止准入']])}${select('隔离证据','isolation',settings.isolation,[['unverified','未验证'],['design-only','仅策略草案，待实机证据']])}${toggle('允许受控代码读取','readCode',settings.readCode)}${toggle('允许写业务代码（本轮禁止）','writeCode',settings.writeCode)}${toggle('开放任意终端（本轮禁止）','terminal',settings.terminal)}<div class="admin-note">worktree 不是 OS 沙箱。原型不创建目录、不执行命令、不读取代码。</div></section><section class="service-card"><h2>代码与现场版本</h2>${input('代码快照（合成）','codeCommit',settings.codeCommit)}${input('现场部署版本（合成）','deployment',settings.deployment)}<div class="admin-resource"><span>允许范围</span><strong>登记仓库 / 固定 commit / 只读路径</strong><span>拒绝范围</span><strong>秘密文件、链接逃逸、跨租户目录</strong><span>证据定位</span><strong>repo / commit / path / 行号 / blobHash</strong><span>其他资源</span><strong>只读查询、脱敏日志、本会话附件</strong></div>${button('runtime-check','检查环境策略','class="admin-primary"')}<div id="runtime-result" role="status">${preflight&&page==='runtime'?esc(preflight):''}</div></section></div>`;}
  function context(){return `<div class="service-two"><section class="service-card"><h2>本轮上下文组装</h2>${input('总窗口预算（示例 token）','contextLimit',settings.contextLimit,'number')}${input('输出预留（示例 token）','outputReserve',settings.outputReserve,'number')}<ol class="service-list"><li>固定策略与操作计划</li><li>用户问题和明确条件</li><li>获准附件与当前版本代码证据</li><li>可追溯会话摘要</li><li>经审核且仍有效的记忆</li></ol>${button('context-check','生成合成材料清单','class="admin-primary"')}<div id="context-result" role="status">${preflight&&page==='context'?esc(preflight):''}</div><p class="admin-muted">实际模型窗口未知时仍阻断真实发送。过滤权限在检索之前，发出前再次核查。</p></section><section class="service-card"><h2>记忆策略</h2>${select('跨会话记忆','memory',settings.memory,[['off','默认关闭'],['personal','个人主动保存并审核'],['environment','系统环境范围 · 维护者审核']])}<p>合成条目：报表核对先对齐时间与状态。</p><dl><dt>来源</dt><dd>demo-record-1 / result-revision-1 · 合成</dd><dt>适用范围</dt><dd>订单 / 测试 · 原来源 ACL 仍有效才可用</dd><dt>条目状态</dt><dd id="memory-state">${esc(memoryState)}</dd></dl><div class="service-actions">${button('memory-review','审核候选')}${button('memory-activate','启用已审核条目')}${button('memory-revoke','撤销')}${button('memory-delete','请求删除')}${button('memory-source-revoke','模拟原来源撤权')}</div><p class="admin-muted">删除先进入 deletion_pending，待正文、索引、摘要及外部副本回执。不会把点击删除称为已经清除所有副本。</p></section></div>`;}
  function userPage(){const user=users.find(u=>u.id===userId);if(!userDraft||userDraft.id!==userId){userDraft=JSON.parse(JSON.stringify(user));if(userDraft.scopes===null)userDraft.scopes=[...(window.ConfigurationPrototype.current().roles.find(r=>r.id===user.role)?.environments||[])];}return `<div class="service-two"><section class="service-card"><h2>成员（合成）</h2>${users.map(u=>button('select-user',`${esc(u.name)} · ${u.status==='active'?'正常':'已暂停'}`,`data-id="${u.id}" class="service-record ${u.id===userId?'selected':''}"`)).join('')}<div class="admin-note">当前管理者可授予：订单 / 测试、订单 / 预发。不能借用户管理自行提权。</div></section><section class="service-card"><h2>${esc(user.name)}</h2><p class="admin-muted">${user.id} · 授权修订 ${user.revision} · 本页只改变合成用户样例。</p>${select('成员角色','userRole',userDraft.role,[['tester','测试人员'],['observer','协作成员'],['access','权限管理员（不可授予）']])}${['orders-test','orders-stage','payments-test'].map(id=>`<label class="admin-check"><input type="checkbox" data-user-scope="${id}" ${userDraft.scopes.includes(id)?'checked':''}>${esc(id)} ${scopes.includes(id)?'':'· 超出可授予范围'}</label>`).join('')}${input('变更理由 / 工单','reason',userDraft.reason||'')}<div class="service-actions">${button('save-user','预览权限变更','class="admin-primary"')}${button('toggle-user',user.status==='active'?'暂停该用户':'恢复该用户')}</div><p class="admin-muted">暂停阻止后续执行并触发撤权核查；真实在途动作是否停止需要权威回执。</p></section></div>`;}
  function recordPage(){const visible=['support','approver'].includes(actor)?[...records,...J.records()].filter(r=>r.scope==='orders-test'&&(!query||r.title.includes(query)||r.owner.includes(query))):[];const r=visible.find(x=>x.id===recordId);const canRead=!!(r&&lease&&lease.id===r.id&&lease.expires>Date.now()&&lease.actor===actor);return `<div class="service-two"><section class="service-card"><h2>获准范围内的问题记录</h2>${input('搜索标题或用户（合成）','query',query)}<p class="admin-muted">列表仅返回订单 / 测试范围的脱敏元数据。不可见记录不参与计数。</p>${visible.length?visible.map(x=>button('select-record',`${esc(x.title)} · ${esc(x.status)}`,`data-id="${x.id}" class="service-record"`)).join(''):'<p>无可访问记录，或当前演示角色无 records.list 权限。</p>'}</section><section class="service-card"><h2>记录详情</h2>${r?`<dl><dt>用户 / 范围</dt><dd>${esc(r.owner)} / ${esc(r.scope)}</dd><dt>状态 / 费用</dt><dd>${esc(r.status)} / ${esc(r.usage)}</dd></dl><h3>后台处理时间线（合成）</h3><ol class="service-list">${r.events.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><details><summary>配置与材料引用</summary><p>${esc(r.preparation?JSON.stringify({context:r.preparation.id,requestedModel:r.preparation.requestedModel,actualModel:r.preparation.actualModelId,code:r.preparation.codeSnapshot,mcp:r.preparation.mcpConnectionRef,memory:r.preparation.memoryRefs,binding:r.binding?.id,resultRevision:r.resultRevision}):'demo-runtime / demo-context-manifest / demo-code-commit / demo-mcp-schema')}</p></details>${actor==='approver'&&r.status==='待负责人审批'?button('approve-plan','审阅当前只读计划（合成）','class="admin-primary"'):''}<h3>正文审阅</h3>${input('审阅理由 / 工单','leaseReason',leaseDrafts[actor+':'+recordId]||'')}${button('lease','申请本条记录的短期审阅','class="admin-primary"')}${button('expire-lease','模拟租约过期')}<div id="record-content">${canRead?`<p class="service-sensitive">${esc(r.text)}</p><small>本次正文读取已记入合成审计。附件和下载仍需单独授权。</small>`:'<p class="admin-muted">正文尚未授权；元数据访问不包含正文和下载。</p>'}</div>`:'<p>请选择一条当前可访问的记录。</p>'}</section></div>`;}
  function render(next,focus=false){
    const target=pages[next]?next:'integrations';if(target!==page)preflight=null;page=target;root.dataset.mode='service';
    root.innerHTML=navigation(page)+`<main class="admin-main"><header class="admin-heading"><div><div class="admin-eyebrow">平台管理 / 接入与治理</div><h1 tabindex="-1">${pages[page][0]}</h1><p>${pages[page][1]}</p></div><span class="admin-badge">合成资料 · 设计评审</span></header><div class="service-role">${select('演示管理角色','actor',actor,Object.entries(roles))}<span>角色切换用于评审拒绝路径，不是登录鉴权。</span></div><div id="service-feedback" role="status" aria-live="polite">${esc(notice)}</div>${({integrations,runtime,context,users:userPage,records:recordPage})[page]()}<details class="admin-audit"><summary>本次合成治理审计（${audit.length}）</summary>${audit.map(a=>`<p>${esc(a.actor)} · ${esc(a.action)} · ${esc(a.target)} · ${a.at}</p>`).join('')||'<p>暂无操作。</p>'}</details></main><dialog id="service-dialog" aria-labelledby="service-dialog-title"></dialog>`;
    if(focus)root.querySelector('h1').focus();
    const dialog=root.querySelector('#service-dialog');dialog.addEventListener('cancel',()=>setTimeout(()=>root.querySelector('[data-service=save-user]')?.focus(),0));
  }
  const feedback=text=>{notice=text;root.querySelector('#service-feedback').textContent=text;};
  root.addEventListener('input',e=>{
    if(root.dataset.mode!=='service')return;const key=e.target.dataset.serviceField;
    if(!key||e.target.tagName==='SELECT'||e.target.type==='checkbox')return;
    if(key==='reason'){userDraft.reason=e.target.value;return;}
    if(key==='query'){query=e.target.value;return;}
    if(key==='leaseReason'){leaseDrafts[actor+':'+recordId]=e.target.value;return;}
    settings[key]=e.target.type==='number'?Number(e.target.value):e.target.value;preflight=null;
  });
  root.addEventListener('change',e=>{
    if(root.dataset.mode!=='service')return;const key=e.target.dataset.serviceField;
    if(e.target.dataset.userScope){const id=e.target.dataset.userScope;userDraft.scopes=e.target.checked?[...new Set([...userDraft.scopes,id])]:userDraft.scopes.filter(x=>x!==id);return;}
    if(!key||e.target.type!=='checkbox'&&e.target.tagName!=='SELECT')return;
    if(key==='actor'){actor=e.target.value;lease=null;notice='演示管理角色已切换，内容租约已失效。';}
    else if(key==='scenario')scenario=e.target.value;
    else if(key==='userRole')userDraft.role=e.target.value;
    else {settings[key]=e.target.type==='checkbox'?e.target.checked:e.target.value;if(key==='memory')J.updateMemory({mode:settings.memory});}
    preflight=null;render(page);
  });
  root.addEventListener('keydown',e=>{if(root.dataset.mode==='service'&&e.target.dataset.serviceField==='query'&&e.key==='Enter'){e.preventDefault();recordId='';render(page);}});
  root.addEventListener('click',e=>{
    if(root.dataset.mode!=='service')return;const b=e.target.closest('[data-service]');if(!b)return;const action=b.dataset.service;
    if(['preflight','runtime-check','context-check','memory-review','memory-activate','memory-revoke','memory-delete','memory-source-revoke'].includes(action)&&actor!=='config'){feedback('当前演示角色没有配置 / 记忆管理权限。');return;}
    if(action==='simulate-admission-change'){if(actor!=='config'){feedback('当前角色不能模拟接入变更。');return;}J.integrationChanged(scenario);log('接入观察变更，计划需复查',scenario);notice='已更新合成接入修订。旧计划失效，已有执行绑定保留。';render(page);return;}
    if(action==='preflight'){const failures={unknown:'阻断：实际模型与 Agent / MCP 能力未知。',schema:'阻断：工具 schema 摘要变化，需重新审核参数与计划。',bridge:'阻断：审批桥接未验证，不允许自动响应权限。',auth:'阻断：认证已过期，需责任人恢复认证。',scope:'阻断：工具参数超出允许环境或资源范围，不允许执行。',timeout:'结果未知：保留原 invocation 引用并核查，禁止新键重做。',normal:'设计条件齐全；真实认证、隔离、能力和执行仍未验证，不能真实启动。'};preflight=settings.acpVersion==='v2-draft'?'阻断：v2 为 Draft，适配器未准入。':failures[scenario];log('离线接入预检',scenario);render(page);return;}
    if(action==='runtime-check'){const blockers=[];if(settings.writeCode)blockers.push('禁止写业务代码');if(settings.terminal)blockers.push('禁止任意终端');if(settings.network!=='allowlist')blockers.push('禁止任意网络');if(!settings.codeCommit.trim()||!settings.deployment.trim())blockers.push('缺少固定版本');else if(settings.codeCommit!==settings.deployment)blockers.push('代码与部署版本不一致，只能给有限结论');blockers.push('真实隔离尚未验证');preflight='阻断：'+blockers.join('；');render(page);return;}
    if(action==='context-check'){const total=settings.contextLimit,reserve=settings.outputReserve;preflight=!Number.isInteger(total)||!Number.isInteger(reserve)||total<1||reserve<1||reserve>=total?'阻断：上下文预算必须为正整数，且需保留足够输入空间。':`合成清单：当前问题、获准代码片段和证据、来源可追溯摘要；长期记忆${settings.memory==='off'?'关闭':'仅限审核通过且原 ACL 仍有效的条目'}。输入预算 ${total-reserve}，输出预留 ${reserve}；真实模型窗口未知，实际发送仍阻断。`;render(page);return;}
    if(action==='memory-source-revoke'){J.updateMemory({sourceAccess:false});log(action,'demo-memory-1');notice='原来源已撤权，相关上下文、结果与正文租约失效。';render(page);return;}
    if(action==='memory-review'){if(memoryState!=='candidate'){feedback('只有候选条目可以审核。');return;}memoryState='reviewed';}
    if(action==='memory-activate'){if(memoryState!=='reviewed'){feedback('须先审核，再启用；候选和已撤销条目不可直接进入上下文。');return;}memoryState='active';}
    if(action==='memory-revoke')memoryState='revoked';
    if(action==='memory-delete')memoryState='deletion_pending';
    if(action.startsWith('memory-')){J.updateMemory({state:memoryState});log(action,'demo-memory-1');render(page);return;}
    if(action==='select-user'){userId=b.dataset.id;userDraft=null;render(page);return;}
    if(action==='save-user'||action==='toggle-user'){
      const u=users.find(x=>x.id===userId);if(actor!=='access'){feedback('当前演示角色没有 users.manage 权限。');return;}
      if(u.id==='demo-admin'){feedback('禁止修改自身身份或自行提权。');return;}
      if(!userDraft.reason||userDraft.reason.trim().length<5){feedback('请填写至少 5 字的变更理由 / 工单。');return;}
      if(userDraft.scopes.some(x=>!scopes.includes(x)&&!(u.scopes||window.ConfigurationPrototype.current().roles.find(r=>r.id===u.role)?.environments||[]).includes(x))||!['tester','observer'].includes(userDraft.role)){feedback('超出可授予的角色或环境范围。');return;}
      const dialog=root.querySelector('#service-dialog');dialog.innerHTML=`<h2 id="service-dialog-title">确认合成用户变更</h2><p>${esc(u.name)} · ${action==='toggle-user'?(u.status==='active'?'暂停后续使用':'恢复使用，不恢复旧批准'):esc(userDraft.role+' / '+userDraft.scopes.join(', '))}</p><p>理由：${esc(userDraft.reason)}</p>${button('cancel','继续编辑')}${button(action==='toggle-user'?'confirm-toggle':'confirm-save','确认变更','class="admin-primary"')}`;dialog.showModal();return;
    }
    if(action==='cancel'){root.querySelector('#service-dialog').close();return;}
    if(action==='confirm-save'||action==='confirm-toggle'){const u=users.find(x=>x.id===userId);if(actor!=='access'||u.id==='demo-admin'||userDraft.revision!==u.revision){feedback('变更权限或修订冲突，需重新检查。');return;}if(action==='confirm-save'){u.role=userDraft.role;u.scopes=[...userDraft.scopes];}else u.status=u.status==='active'?'suspended':'active';u.revision++;J.userChanged();log(action,u.id);lease=null;userDraft=null;notice='已更新合成用户样例；真实身份服务和在途撤权仍未实现。';render(page);return;}
    if(action==='approve-plan'){const r=J.records().find(x=>x.id===recordId);if(actor!=='approver'||r?.scope!=='orders-test'||r.status!=='待负责人审批'){feedback('无权处理此计划或计划已失效。');return;}const dialog=root.querySelector('#service-dialog');dialog.innerHTML=`<h2 id="service-dialog-title">确认这份只读计划？</h2><p>${esc(r.title)} / ${esc(r.scope)}<br>模型：${esc(r.preparation.requestedModel)}<br>上下文：${esc(r.preparation.id)}<br>固定输入修订：${r.preparation.inputRevision}；不包含写入。合成演示，不调用真实资源。</p>${button('cancel','取消')}${button('confirm-plan','批准这份计划','class="admin-primary"')}`;dialog.dataset.contextRef=r.preparation.id;dialog.showModal();return;}

  <script>/* Offline conversation presentation. All replies are scripted; no model or resource calls. */

  const C=window.ConfigurationPrototype,J=window.ReviewJourney;
  function sync(s, resetModel=false) {
    const v=C.visible(s.snapshot||C.current(),s.roleId);
    if(!s.locked){
      const sys=v.systems.find(x=>x.id===s.systemId)||v.systems[0];
      const env=v.environments.find(x=>x.id===s.environmentId&&x.system===sys?.id)||v.environments.find(x=>x.system===sys?.id);
      const model=(!resetModel&&v.models.find(x=>x.id===s.modelId))||v.models.find(x=>x.id===env?.defaultModel)||v.models[0];
      Object.assign(s,{systemId:sys?.id,environmentId:env?.id,modelId:model?.id,system:sys?.name||'无可用系统',environment:env?.name||'无可用环境',model:model?.name||'无可用模型'});
    }
    return v;
  }
  const denied=s=>C.access(s);
  function check(s){const error=denied(s);if(error){root.querySelector('#chat-notice').textContent=error;return false;}return true;}
  let nextId = 1, currentId, timer = null;
  const sessions = [];
  function create() {
    const s = {id:nextId++, roleId:C.role(),subjectId:J.subjectId(C.role()),inputRevision:0,latestResultRevision:0,verification:null,binding:null,trace:[], title:'新对话', systemId:null,environmentId:null,modelId:null, draft:'', files:[], messages:[], phase:'intro', busy:false, locked:false};
    sync(s);sessions.unshift(s); currentId=s.id; return s;
  }
  create();
  const current = () => sessions.find(s => s.id === currentId);
  const button = (action, text, extra='') => `<button type="button" data-chat="${action}" ${extra}>${text}</button>`;
  const options = (values, selected) => values.map(v => `<option${v===selected?' selected':''}>${esc(v)}</option>`).join('');
  function currentResult(s,m){return m.resultRevision===s.latestResultRevision&&m.inputRevision===s.inputRevision&&s.phase==='result'&&!s.busy&&!denied(s)&&J.sourceCurrent(m.preparation);}
  function invalidatePlans(s,reason){for(const m of s.messages)if(m.kind==='permission'&&(!m.decision||m.pendingReview)){m.pendingReview=false;m.decision=reason;J.event(s,reason);}}
  function scheduleExpiry(s,preparation){setTimeout(()=>{const m=s.messages.find(x=>x.kind==='permission'&&x.preparation.id===preparation.id&&(!x.decision||x.pendingReview));if(!m)return;m.pendingReview=false;m.decision='计划已过期，请补充信息重新确认';s.phase='details';J.event(s,'待确认计划到期，未执行');J.sync(s);if(currentId===s.id)render();},Math.max(0,Date.parse(preparation.validUntil)-Date.now()+1));}
  function message(s, m, i) {
    let content = `<div class="message-text">${esc(m.text)}</div>`;
    if(m.files?.length) content += `<div class="message-files">${m.files.map(f=>`<span>▧ ${esc(f.name)} · 仅文件名</span>`).join('')}</div>`;
    if(m.kind === 'permission') content += `<div class="inline-permission"><strong>确认本次检查范围</strong><p>${esc(s.system)} · ${esc(s.environment)}<br>只读查询与本次问题有关的记录，生成检查摘要；不修改数据。</p><small>离线演示：不会访问任何系统。范围变更需重新确认。</small><div>${m.decision ? `<span>${esc(m.decision)}</span>` : (C.visible(C.current(),s.roleId).role?.canApproveRead?button('allow','允许本次检查',`class="chat-primary" data-message="${i}"`):button('request-review','请负责人确认',`class="chat-primary" data-message="${i}"`))+button('deny','暂不允许',`data-message="${i}"`)}</div></div>`;
    if(m.kind === 'result') {
      if(!J.sourceCurrent(m.preparation))content='<p class="admin-muted">该结果关联的来源已失效，暂不能读取、下载或确认。历史版本保留。</p>';
      const active=currentResult(s,m);
      content+=`<details class="chat-provenance"><summary>检查依据 · 结果 ${m.resultRevision}（合成）</summary><p>上下文：${esc(m.preparation.id)}；请求模型：${esc(m.preparation.requestedModel)}；实际模型未知。<br>代码与工具引用均为演示。附件仅文件名，未解析；使用记忆 ${m.preparation.memoryRefs.length} 项。</p></details><div class="result-choice">${m.verified?'<span>✓ 已确认此示例结果</span>':active?button('resolved','问题已解决',`data-message="${i}"`)+button('continue','继续排查',`data-message="${i}"`):'<span>历史或失效结果，不能确认当前问题</span>'}${active||m.verified&&J.sourceCurrent(m.preparation)?button('download','下载合成差异示例',`data-message="${i}" ${!C.visible().role?.download?'disabled':''}`):''}</div>`;
    }
    return `<article class="chat-message ${m.role}"><div class="message-author">${m.role==='user'?'你':'测试助手 <span>模拟回复</span>'}</div>${content}</article>`;
  }
  function render(focus=false) {
    const s=current(),v=sync(s),blocked=denied(s);J.sync(s);
    const history=sessions.filter(x=>x.subjectId===s.subjectId&&(C.visible().role?.history||x.id===s.id)&&(!denied(x)||x.id===s.id));
    const prompts=v.systems.find(x=>x.id===s.systemId)?.prompts||[];
    root.innerHTML=`<aside class="chat-sidebar"><a class="chat-brand" href="#chat"><span>◈</span> 测试助手</a>${button('new','＋ 新对话','class="new-chat"')}<div class="chat-history-label">最近对话</div><nav aria-label="最近对话">${history.map(x=>button('session',esc(denied(x)?'不可访问的对话':x.title),`data-id="${x.id}" class="session-item ${x.id===s.id?'selected':''}" ${s.busy?'disabled':''}`)).join('')}</nav><div class="chat-sidebar-bottom"><a href="#admin-systems">平台管理 ↗</a><small>离线原型 · 刷新清空对话</small></div></aside>
    <main class="chat-main"><header class="chat-header"><strong>测试助手</strong>${button('new','＋ 新对话','class="mobile-new"')}<select class="mobile-new" id="chat-mobile-history" aria-label="切换对话">${history.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(denied(x)?'不可访问的对话':x.title)}</option>`).join('')}</select><span>初始设计 · 离线演示</span></header><div class="chat-scroll" role="log" aria-label="对话记录" aria-live="polite">${blocked ? `<div class="chat-welcome"><h1>暂无可用的检查范围</h1><p>${esc(blocked)}</p></div>` : s.messages.length ? `<div class="message-list">${s.messages.map((m,i)=>message(s,m,i)).join('')}${s.busy?'<div class="replying" role="status">正在生成模拟回复<span>•••</span></div>':''}</div>` : '<div class="chat-welcome"><div class="welcome-symbol">◈</div><h1>今天想检查什么？</h1><p>选好系统和环境，直接描述问题。</p></div>'}</div>
    <div class="chat-bottom">${!s.messages.length?`<div class="quick-prompts">${prompts.map((p,i)=>button('prompt',p,`data-prompt="${i}"`)).join('')}</div>`:''}<form id="chat-form" class="chat-composer"><div class="chat-context"><label>系统 <select id="chat-system" ${s.locked?'disabled':''}>${options(s.locked?[s.system]:v.systems.map(x=>x.name),s.system)}</select></label><label>环境 <select id="chat-environment" ${s.locked?'disabled':''}>${options(s.locked?[s.environment]:v.environments.filter(x=>x.system===s.systemId).map(x=>x.name),s.environment)}</select></label>${s.locked?'<span class="context-fixed" title="新建对话可选择其他系统和环境">本对话已固定</span>':''}</div><label class="sr-only" for="chat-input">描述问题</label><textarea id="chat-input" placeholder="描述你遇到的问题，也可以附上截图或文件…" rows="2">${esc(s.draft)}</textarea><div class="draft-files">${s.files.map((f,i)=>`<span>▧ ${esc(f.name)} ${button('remove-file','×',`data-file="${i}" aria-label="移除 ${esc(f.name)}"`)}</span>`).join('')}</div><div class="composer-tools"><div>${button('attach','＋','class="attach-button" aria-label="添加附件" '+(blocked||!C.visible().role?.attachments?'disabled':''))}<input id="chat-files" type="file" multiple hidden><label class="sr-only" for="chat-model">模型</label><select id="chat-model" aria-label="模型" ${s.busy?'disabled':''}>${options([...new Set([s.model,...v.models.map(x=>x.name)])],s.model)}</select><span class="model-note">演示</span></div>${s.busy?button('stop','停止','class="send-button"'):'<button type="submit" class="send-button" aria-label="发送消息" '+(blocked||(!s.draft.trim()&&!s.files.length)?'disabled':'')+'>↑</button>'}</div></form><div id="chat-notice" role="status">${blocked?esc(blocked):s.files.length?'附件仅展示文件名，未读取内容。':'模拟对话，不连接模型或业务系统。'}</div></div></main>`;
    if(focus)root.querySelector('#chat-input').focus();
    const scroll=root.querySelector('.chat-scroll');scroll.scrollTop=scroll.scrollHeight;
  }
  function reply(s, fn,preparation=null) {
    s.busy=true;J.sync(s);if(currentId===s.id)render();
    timer=setTimeout(()=>{s.busy=false;timer=null;if(!denied(s)&&(!preparation||J.planCurrent(s,preparation)))fn();else {if(s.binding)s.binding.state='stopped_simulation';s.phase='details';J.event(s,'权限或上下文变化，本地模拟停止；真实在途执行需核查');s.messages.push({role:'assistant',text:'范围、权限或上下文已变化，已停止本次模拟回复。'});}J.sync(s);if(currentId===s.id)render(true);},650);
  }
  function send() {
    const s=current(); if(s.busy||(!s.draft.trim()&&!s.files.length)||!check(s))return;
    if(s.files.length&&!C.visible().role.attachments){root.querySelector('#chat-notice').textContent='当前角色不能添加附件，请移除后再发送。';return;}
    if(!s.snapshot)s.snapshot=C.current();
    invalidatePlans(s,'已被新的补充内容替代');
    s.inputRevision++;s.verification=null;
    const text=s.draft.trim()||'请查看这些附件';
    s.messages.push({role:'user',text,files:s.files,model:s.model,inputRevision:s.inputRevision});J.event(s,'用户消息已保存（合成）');
    s.draft='';s.files=[];s.locked=true;
    if(s.title==='新对话')s.title=text.slice(0,22);
    const first=s.phase==='intro';
    if(first)s.topic=/接口|回调/.test(text)?'接口':/日志/.test(text)?'日志':'报表';
    s.preparation=J.prepare(s);J.event(s,'上下文与接入快照已固定（合成）');
    reply(s,()=>{
      if(first){s.messages.push({role:'assistant',text:`已选择${s.system}的${s.environment}。请补充发生时间、预期结果和实际现象；有截图或错误信息也可以一起说明。\n\n这里先演示条件追问，附件内容尚未读取。`});s.phase='details';}
      else {s.messages.push({role:'assistant',kind:'permission',preparation:s.preparation,configurationRevision:C.current().revision,text:'收到补充信息。接下来可以先做一次只读检查，请确认下面的范围。'});s.phase='permission';scheduleExpiry(s,s.preparation);}
    },s.preparation);
  }
  function startInspection(s,m){m.pendingReview=false;m.decision='已允许本次示例检查';J.event(s,'当前计划已确认（合成）');s.binding={id:`demo-chat-binding-${s.id}-${s.inputRevision}`,provider:m.preparation.provider,state:'active_simulation',actualExecution:'not_run'};J.event(s,'唯一绑定已建立：'+s.binding.id);reply(s,()=>{s.latestResultRevision++;if(s.binding)s.binding.state='terminal_simulation';J.event(s,'产物已就绪，结果待用户验证（合成）');s.messages.push({role:'assistant',kind:'result',resultRevision:s.latestResultRevision,inputRevision:s.inputRevision,preparation:m.preparation,text:'示例检查已完成，等待你验证。\n\n演示结论：'+(s.topic==='接口'?'先核对请求参数、响应码和同一时点的服务日志，缩小异常范围。':s.topic==='日志'?'先按发生时间与请求标识关联日志，区分首个异常和后续连带错误。':'报表与明细使用的筛选范围可能不同，建议先对齐时间范围与状态条件，再核对差异。')+'\n\n这是一条合成结果，用于评审对话流程；没有读取实际数据，也没有生成真实证据。'});s.phase='result';},m.preparation);}
  root.addEventListener('input',e=>{if(e.target.id==='chat-input'){const s=current();s.draft=e.target.value;const sendButton=root.querySelector('[type=submit]');if(sendButton)sendButton.disabled=!!denied(s)||(!s.draft.trim()&&!s.files.length);}});
  root.addEventListener('keydown',e=>{if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}});
  root.addEventListener('submit',e=>{e.preventDefault();send();});
  root.addEventListener('change',e=>{
    const s=current();
    if(e.target.id==='chat-mobile-history'){if(!s.busy)currentId=Number(e.target.value);render();}
    if(e.target.id==='chat-system'&&!s.locked){s.systemId=C.visible().systems.find(x=>x.name===e.target.value)?.id;s.environmentId=null;sync(s,true);render();root.querySelector('#chat-system').focus();}
    if(e.target.id==='chat-environment'&&!s.locked){s.environmentId=C.visible().environments.find(x=>x.system===s.systemId&&x.name===e.target.value)?.id;sync(s,true);render();}
    if(e.target.id==='chat-model'&&!s.busy){const m=C.visible(s.snapshot||C.current(),s.roleId).models.find(x=>x.name===e.target.value);if(m&&m.id!==s.modelId){invalidatePlans(s,'模型已变更，请补充信息重新确认');s.model=m.name;s.modelId=m.id;s.verification=null;s.phase=s.phase==='intro'?'intro':'details';J.event(s,'下轮请求模型偏好已变更；旧执行快照保留');}render();}
    if(e.target.id==='chat-files'&&C.visible().role?.attachments&&!denied(s)){s.files.push(...Array.from(e.target.files,f=>({name:f.name,size:f.size})));render(true);}
  });
  root.addEventListener('click',async e=>{
    const b=e.target.closest('[data-chat]');if(!b)return;
    const s=current(), action=b.dataset.chat;
    if(action==='stop'){clearTimeout(timer);timer=null;s.busy=false;if(s.binding)s.binding.state='stopped_simulation';J.event(s,'停止本地模拟回复，未发生真实执行');s.messages.push({role:'assistant',text:'已停止本次模拟回复，可以继续补充。'});render(true);return;}
    if(action==='new'){if(s.busy){root.querySelector('#chat-notice').textContent='请先停止当前回复，再新建对话。';return;}create();render(true);return;}
    if(action==='session'&&!s.busy){currentId=Number(b.dataset.id);render(true);return;}
    if(action==='prompt'){s.draft=C.visible(s.snapshot||C.current(),s.roleId).systems.find(x=>x.id===s.systemId)?.prompts[Number(b.dataset.prompt)]||'';render(true);return;}
    if(action==='attach'&&C.visible().role?.attachments&&!denied(s)){root.querySelector('#chat-files').click();return;}
    if(action==='remove-file'){s.files.splice(Number(b.dataset.file),1);render(true);return;}
    if(s.busy)return;
    const m=s.messages[Number(b.dataset.message)];
    if(action==='allow'&&m?.kind==='permission'&&!m.decision){if(!check(s))return;if(!J.planCurrent(s,m.preparation)){m.decision='配置已更新，请补充信息重新确认';render();return;}if(!C.visible(C.current(),s.roleId).role?.canApproveRead){root.querySelector('#chat-notice').textContent='当前用户无此计划审批权，请交由负责人确认。';return;}startInspection(s,m);return;}
    if(action==='request-review'&&m?.kind==='permission'&&!m.decision){if(!check(s)||!J.planCurrent(s,m.preparation))return;m.pendingReview=true;m.decision='等待负责人确认';J.event(s,'计划已送负责人，提交人未自批');render(true);return;}
    if(action==='deny'&&m?.kind==='permission'&&!m.decision){m.decision='暂未允许';s.messages.push({role:'assistant',text:'已暂停检查。你可以继续补充信息，准备好后再确认新的检查范围。'});s.phase='details';}
    if(action==='resolved'&&m?.kind==='result'&&!m.verified&&currentResult(s,m)){m.verified=true;s.verification={resultRevision:m.resultRevision,inputRevision:s.inputRevision,subjectId:s.subjectId};J.event(s,'用户确认结果版本 '+m.resultRevision);s.messages.push({role:'user',text:'已确认此示例结果。'});}
    if(action==='continue'&&m?.kind==='result'&&currentResult(s,m)){s.draft='还没有解决，补充情况：';render(true);return;}
    if(action==='download'&&m?.kind==='result'){
      if(denied(s)||!C.visible().role?.download||!J.sourceCurrent(m.preparation)||!currentResult(s,m)&&!m.verified){root.querySelector('#chat-notice').textContent='下载被阻止：范围、来源或产物权限已失效。';return;}
      const file=J.artifact(s,m);const url=URL.createObjectURL(new Blob([file.content],{type:file.mime}));const a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);J.event(s,'下载合成产物：'+file.id);J.sync(s);return;
    }
    render(true);
  });
  C.subscribe(()=>{
    const s=current();
    if(s.roleId!==C.role()){if(s.busy){clearTimeout(timer);timer=null;s.busy=false;s.messages.push({role:'assistant',text:'预览身份已切换，本次模拟回复已停止。'});}create();}
    for(const item of sessions){
      for(const m of item.messages)if(m.kind==='permission'&&(!m.decision||m.pendingReview)&&!J.planCurrent(item,m.preparation)){m.pendingReview=false;m.decision='配置已更新，请补充信息重新确认';J.event(item,'配置、授权或记忆修订使旧计划失效');}
      if(item.busy&&denied(item)){clearTimeout(timer);timer=null;item.busy=false;if(item.binding)item.binding.state='stopped_simulation';J.event(item,'撤权停止本地模拟；真实执行未发生');}
      J.sync(item);
    }
    if(!root.hidden)render();
  });
  J.setApprovalHandler((recordId,contextRef)=>{const s=sessions.find(x=>'demo-chat-'+x.id===recordId);const m=s?.messages.findLast(x=>x.kind==='permission'&&x.pendingReview);if(!s||!m||denied(s)||!J.planCurrent(s,m.preparation)||m.preparation.id!==contextRef)return {ok:false,reason:'计划、权限或上下文已失效，需要重新提交'};startInspection(s,m);return {ok:true};});
  window.ChatPrototype={render,inspect:()=>JSON.parse(JSON.stringify(current()))};
})();
</script>

    if(!a)return card('暂无权限请求','<div class="empty">先加载“审批与安全恢复”演示路径，或在原执行中模拟受限导出请求。</div>');
    const bridge=M.connections[state.binding.provider].bridge;
    return '<div class="banner">批准固定的合成文件导出计划。原生请求没有统一固定超时；本页手动模拟请求失效，不运行 SQL 或写入。</div><div class="grid"><div class="stack">'+card('固定操作与范围',kv([['动作','导出合成差异文件；仅测试环境'],['operationId',a.operationId],['获审计划哈希',a.planHash],['当前计划哈希',state.currentPlanHash],['目标集合','合成订单 3 条；字段仅国家和金额'],['前置状态',a.preconditionsMatch?'合成数据 revision=7 已核对':'已漂移，需要重新取证'],['批准有效性',a.valid?'演示逻辑时钟：有效':'演示逻辑时钟：已过期'],['资源权限','仅合成样例；真实资源无授权'],['审批桥接',bridge?'模拟支持，实际未知':'当前连接不支持完整审批桥接']]))+card('业务决定','<div class="between">'+tag(a.decision,a.decision!=='approved')+'<code>'+esc(a.id)+'</code></div><label class="check"><input type="checkbox" id="approval-check" '+(formDrafts.approvalId===a.id&&formDrafts.checked?'checked':'')+'>我已审阅当前计划、影响范围、前置条件与有效期。</label><label for="approval-comment">审批意见（拒绝必填）</label><input type="text" id="approval-comment" value="'+esc(formDrafts.approvalId===a.id?formDrafts.comment:a.comment)+'" placeholder="请输入审批意见">'+actions(btn('approve','保存业务批准',a.decision==='pending','primary')+btn('deny','拒绝本计划',a.decision==='pending')))+'<section class="card"><h2>历史审批</h2>'+(state.approvalHistory.length?state.approvalHistory.map(h=>'<p><code>'+esc(h.id)+'</code> '+tag(h.decision,true)+' → <code>'+esc(h.requestId)+'</code></p>').join(''):'<div class="empty">尚无历史决定。恢复后保留旧记录。</div>')+'</section></div><div class="stack">'+card('权限送达与动作结果',kv([['原生 requestId',a.requestId],['映射 revision',a.mappingRevision],['请求有效',a.requestLive?'合成请求仍有效':'已失效 / 不可重放'],['响应送达',labels[a.delivery]||a.delivery],['动作结果',labels[a.action]||a.action],['权限发送次数',state.permissionSends],['已核验动作次数',state.operationsExecuted]])+actions(btn('send_permission','模拟发送权限响应',a.decision==='approved'&&a.delivery==='ready'&&bridge,'primary')+btn('send_timeout','模拟响应送达未知',a.decision==='approved'&&a.delivery==='ready'&&bridge))+actions(btn('lookup_delivery','核对原决定回执',a.delivery==='delivery_unknown')+btn('operation_receipt','模拟动作核验回执',a.delivery==='delivered'&&!a.consumed)+btn('inner_deny','模拟内层策略拒绝',a.decision==='approved'&&!a.consumed)))+card('失效与安全恢复','<div class="recovery"><p>① 核查原拥有者与未执行证明</p><p>② 保留旧请求和决定</p><p>③ 原 Binding 准备新请求</p><p>④ 新业务审批，再复查，再发送</p></div>'+actions(btn('expire_native','模拟原生请求失效',a.delivery==='ready')+btn('expire_business','模拟业务批准过期',a.delivery==='ready')+btn('drift','模拟前置条件漂移',a.delivery==='ready'))+actions(btn('refresh_plan','模拟重新取证',a.delivery==='stale')+btn('prepare_new_permission','安全准备新请求',a.delivery==='stale')))+'</div></div>';
  }
  function contractPage() {
    const l=window.REVIEW_TABLES.layers[layer];
    const methods=['inspectCapabilities','validateBinding','start','lookupSubmission','closeSubmission','getSnapshot','readEvents','submitInput','cancel','preparePermissionResume','respondPermission','getArtifact'];
    return '<div class="banner">正式数据结构与异常规则保存在设计文档。这里展示设计合同，不代表接口已经实现。</div>'+card('执行契约','<div class="actions compact">'+methods.map(x=>'<code>'+x+'</code>').join('')+'</div><p class="help">同键同哈希复用回执；not_found 不证明未接纳；取消请求不等于停止确认；未知不能换后端重放。</p><a href="../design/EXECUTION-PROVIDER.md">完整合同文档 →</a>')+'<div class="card mt"><div class="between"><h2>分层状态转换</h2><label for="state-layer">选择状态层</label><select id="state-layer" style="max-width:200px">'+Object.entries(window.REVIEW_TABLES.layers).map(([id,x])=>'<option value="'+id+'" '+(id===layer?'selected':'')+'>'+x.label+'</option>').join('')+'</select></div><p class="muted small">未列出的转换拒绝；重复事实只确认，不重复执行。审批决定、送达与动作状态分开。</p><div class="table-wrap"><table><thead><tr><th>ID / 从</th><th>触发 → 到</th><th>责任主体</th><th>守卫</th><th>原子组</th></tr></thead><tbody>'+l.transitions.map(x=>'<tr><td><b>'+x.id+'</b><br>'+esc(x.from.join(' / '))+'</td><td>'+esc(x.event)+'<br>→ '+esc(x.to)+'</td><td>'+esc(x.actor)+'</td><td>'+esc(x.guard)+'</td><td>'+esc(x.atomic)+'</td></tr>').join('')+'</tbody></table></div></div>';
  }
  function exceptionPage() {
    return states()+'<div class="grid"><div class="stack">'+card('当前阻塞与证据','<p>'+esc(state.message)+'</p>'+kv([['能力状态',state.capability==='simulation_only'?'仅合成演示，实际 unknown':state.capability],['用量门禁',state.usageBlocked?'新增计费阻断':'真实费用未上报；仅演示计数'],['证据一致性',state.evidenceConsistent?'合成版本与时点可比':'版本或时点不一致，限制结论'],['产物完整性',labels[state.artifact]||state.artifact],['未知拥有权',state.binding.ownerOccupied?'仍保留，不可替代执行':'无未关闭执行占用']]),'warning')+card('失效路径演示',actions(btn('usage_unknown','用量未上报')+btn('evidence_mismatch','证据版本不一致')+btn('artifact_corrupt','产物完整性失败')+btn('handoff','转人工接管',!['resolved','archived_unconfirmed'].includes(state.issue))))+'</div>'+card('人工接管材料','<ul class="checklist"><li>问题、条件、固定系统环境</li><li>唯一 Binding、外部运行引用、未知接纳和副作用</li><li>审批、原生请求及送达历史</li><li>最后事件水位、证据及文件状态</li><li>预算挂账、下一步核查与负责人</li></ul><p>接管责任人：<strong>合成测试负责人</strong></p><p class="help">接管不会清除未决拥有权。包仅包含合成材料，真实导出仍须逐项授权。</p>'+actions(ui('download-handoff','下载合成接管包')) )+'</div>';
  }
  function render(focus=false) {
    const chat = !route || route === 'chat';
    const admin = route.startsWith('admin-');
    if(route!=='admin-records')window.ServiceDesignPrototype.hide();
    document.querySelector('#configuration-root').hidden=!admin;
    document.querySelector('#chat-root').hidden=!chat;
    document.querySelector('#review-root').hidden=chat||admin;
    if(admin){window.AdminPrototype.render(route.slice(6),focus);return;}
    if(chat){window.ChatPrototype.render(focus);return;}
    if(!pages[route])route='workbench';
    document.querySelector('#work-nav').innerHTML=link('workbench')+link('result');
    document.querySelector('#admin-nav').innerHTML=['connections','binding','approval','contract','exceptions'].map(x=>link(x)).join('');
    const views={workbench,result:resultPage,connections:connectionsPage,binding:bindingPage,approval:approvalPage,contract:contractPage,exceptions:exceptionPage};
    document.querySelector('#page-header').innerHTML=header();
    document.querySelector('#content').innerHTML=views[route]();
    document.querySelector('#feedback').textContent=state.message;
    if(focus)document.querySelector('#review-root h1').focus();
  }
  function perform(action,payload={}){if(document.querySelector('#approval-comment'))formDrafts={approvalId:state.approval?.id,comment:document.querySelector('#approval-comment').value,checked:document.querySelector('#approval-check').checked};state=M.act(state,action,payload);render();}
  function download(name,content,type) {
    const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.default){perform('default_provider',{provider:b.dataset.default});return;}
    if(b.dataset.action){perform(b.dataset.action,{text:document.querySelector('#conditions')?.value,checked:document.querySelector('#approval-check')?.checked,comment:document.querySelector('#approval-comment')?.value});return;}
    if(b.dataset.ui==='reset'){resetTrigger=b;document.querySelector('#reset-dialog').showModal();}
    if(b.dataset.ui==='close-reset'){document.querySelector('#reset-dialog').close();resetTrigger?.focus();}
    if(b.dataset.ui==='confirm-reset'){document.querySelector('#reset-dialog').close();state=M.createState(state.scenario);formDrafts={};render(true);}
    if(b.dataset.ui==='download-sample'){
      if(state.artifact!=='verified'||!state.evidenceConsistent||!state.results.length){document.querySelector('#feedback').textContent='下载被阻止：当前产物未核验或证据不一致。';return;}
      download('合成差异样例.csv','\uFEFF国家,报表金额_EUR,明细金额_EUR,差额_EUR,来源\n德国,128450,125920,2530,离线合成示例_非业务结果\n','text/csv;charset=utf-8');
    }
    if(b.dataset.ui==='download-handoff')download('合成人工接管包.json',JSON.stringify({provenance:'offline_synthetic_example_not_business_evidence',responsible:'合成测试负责人',unknowns:'所有真实能力、真实执行、真实费用均未验收',next:'核查原拥有者与外部副作用；禁止静默换后端重放',state},null,2),'application/json');
  });
  document.addEventListener('change',e=>{
    if(e.target.id==='scenario'){state=M.createState(e.target.value);formDrafts={};render(true);}
    if(e.target.id==='state-layer'){layer=e.target.value;render();}
  });
  document.querySelector('#reset-dialog').addEventListener('cancel',()=>setTimeout(()=>resetTrigger?.focus(),0));
  window.addEventListener('hashchange',()=>{route=location.hash.slice(1);render(true);});
  window.__reviewPrototype={getState:()=>JSON.parse(JSON.stringify(state)),act:perform,loadScenario:name=>{state=M.createState(name);formDrafts={};render();}};
  render();
})();
</script>
</body></html>
