  <script>/* Shared offline review ledger. Synthetic identities, contexts, records and files only. */
(() => {
  'use strict';
  const clone=x=>JSON.parse(JSON.stringify(x));
  const users=[
    {id:'demo-tester',name:'合成测试用户',role:'tester',scopes:['orders-test'],status:'active',revision:1},
    {id:'demo-collaborator',name:'合成协作成员',role:'observer',scopes:['orders-test'],status:'active',revision:1},
    {id:'demo-admin',name:'当前合成管理员',role:'access',scopes:['orders-test'],status:'active',revision:1},
    {id:'demo-live-tester',name:'当前对话用户（合成测试人员）',role:'tester',scopes:null,status:'active',revision:1},
    {id:'demo-live-observer',name:'当前对话用户（合成协作成员）',role:'observer',scopes:null,status:'active',revision:1}
  ];
  const records=new Map(),listeners=[],recordListeners=[];let approvalHandler=null,rejectionHandler=null,stopHandler=null;
  const integration={revision:1,mcpSchemaRevision:1,actualCapabilities:'unknown'};
  const memory={id:'demo-memory-1',state:'candidate',mode:'off',sourceAccess:true,revision:1,scope:'orders-test',ownerSubjectId:'demo-live-tester'};
  const subjectId=role=>role==='observer'?'demo-live-observer':'demo-live-tester';
  const subject=role=>clone(users.find(u=>u.id===subjectId(role)));
  const emit=()=>listeners.forEach(fn=>fn());
  function event(s,type){
    s.trace??=[];s.trace.push({id:`demo-chat-${s.id}-event-${s.trace.length+1}`,sequence:s.trace.length+1,type,at:new Date().toISOString()});
  }
  function memoryAllowed(scope,subjectId){const c=window.ConfigurationPrototype?.current(),env=c?.environments.find(e=>e.id===scope),policy=c?.contextPolicies.find(p=>p.id===env?.contextPolicyId);return !!(policy?.enabled&&policy.memory!=='off'&&(policy.memory!=='personal'||memory.ownerSubjectId===subjectId)&&memory.state==='active'&&memory.sourceAccess&&memory.scope===scope);}
  function prepare(s){
    const owner=subject(s.roleId),model=s.snapshot.models.find(m=>m.id===s.modelId),resources=window.ResourceDesign.resolve(window.ConfigurationPrototype.current(),s.environmentId),executionPolicy=window.ConfigurationPrototype.executionPolicy(s),choice=window.FlowDesign.choose(s),flowDecision=choice.id?window.FlowDesign.resolve(window.ConfigurationPrototype.current(),s,choice.id):{configured:false,workflowId:null,workflowName:null,reasons:[choice.reason],toolBindings:[],skillBindings:[],realAdmission:'unknown',realExecutionAllowed:false};
    if(!flowDecision.configured&&!['collect_only','blocked'].includes(executionPolicy.mode)){executionPolicy.mode='blocked';executionPolicy.reason=flowDecision.reasons.join('；');}
    return {dependencyStamp:window.ConfigurationPrototype.dependencyStamp(s,flowDecision.workflowId),understanding:window.ConfigurationPrototype.understandingPolicy(s),id:`demo-context-${s.id}-${s.inputRevision}`,synthetic:true,subjectId:owner.id,validUntil:new Date(Date.now()+5*60*1000).toISOString(),turnId:`demo-turn-${s.id}-${s.inputRevision}`,inputRevision:s.inputRevision,
      configurationRevision:s.snapshot.revision,policyRevision:window.ConfigurationPrototype.current().revision,authorizationRevision:owner.revision,
      systemId:s.systemId,environmentId:s.environmentId,modelId:s.modelId,executionContext:window.ContextQuota.context(window.ConfigurationPrototype.current(),s,flowDecision),quotaSnapshot:executionPolicy.quota,governanceSnapshot:executionPolicy.governance,resources,executionPolicy,flowDecision,approvalSummary:{question:s.messages.find(m=>m.role==='user')?.text||s.title,conditions:s.messages.findLast(m=>m.role==='user')?.text||'',system:s.system,environment:s.environment},plannedBindingId:['collect_only','blocked'].includes(executionPolicy.mode)?null:`demo-chat-binding-${s.id}-${s.inputRevision}`,
      modelObservation:'unknown',requestedModel:s.model,actualModelId:null,provider:model?.provider||'unknown',
      runtimeRef:executionPolicy.governance?.runtime?.id||'demo-runtime-readonly-unverified',codeSnapshot:null,requestedCodeRefs:resources.projects.map(p=>({id:p.id,sourceKind:p.sourceKind,requestedRef:p.requestedRef,actualContentHash:null})),deployedCommit:null,mcpConnectionRef:flowDecision.toolBindings.map(t=>t.connectionId).filter((x,i,a)=>a.indexOf(x)===i).join(',')||null,mcpSchemaRevision:integration.mcpSchemaRevision,integrationRevision:integration.revision,mcpCapability:'unknown',
      messageIds:s.messages.map((m,i)=>`demo-chat-${s.id}-message-${i+1}`),
      attachmentNames:s.messages.flatMap(m=>(m.files||[]).map(f=>f.name)),attachmentContentsRead:false,
      memoryRevision:memory.revision,memoryRefs:executionPolicy.mode!=='collect_only'&&memoryAllowed(s.environmentId,owner.id)?[memory.id]:[],
      excludedMemory:executionPolicy.mode==='collect_only'?'仅收集，不组装执行记忆':memoryAllowed(s.environmentId,owner.id)?null:executionPolicy.governance?.contextPolicy?.memory==='off'?'默认关闭':!memory.sourceAccess?'原来源授权失效':memory.state!=='active'?'未审核启用或已撤销':'环境不匹配'};
  }
  function planCurrent(s,p){
    return !!p&&Date.parse(p.validUntil)>Date.now()&&p.inputRevision===s.inputRevision&&p.modelId===s.modelId&&p.dependencyStamp===window.ConfigurationPrototype.dependencyStamp(s,p.flowDecision?.workflowId)&&p.authorizationRevision===subject(s.roleId).revision&&p.memoryRevision===memory.revision&&p.integrationRevision===integration.revision;
  }
  function sourceCurrent(preparation){return !preparation?.memoryRefs.length||memoryAllowed(preparation.environmentId,preparation.subjectId);}
  function sync(s){
    if(!s.locked||!s.messages.length)return;
    const current=s.messages.findLast(m=>m.kind==='result'),approval=s.messages.findLast(m=>m.kind==='permission');
    const record={id:'demo-chat-'+s.id,owner:s.subjectId,inputRevision:s.inputRevision,scope:s.environmentId,title:s.title,titleMeta:clone(s.titleMeta),titleHistory:clone(s.titleHistory),
      status:s.queued?'排队中':!sourceCurrent(current?.preparation)?'来源失效待核查':s.verification?.resultRevision===s.latestResultRevision?'已确认':s.phase==='result'?'待验证':s.phase==='permission'?(s.messages.some(m=>m.pendingReview)?'待负责人审批':'待确认'):s.phase==='collect_only'?'仅收集':s.phase==='blocked'?'执行已阻止':s.phase==='rejected'?'审批拒绝':s.phase==='stopped'?'已停止（合成）':s.busy?'处理中':'待补充',
      text:s.messages.map(m=>(m.role==='user'?'用户：':'助手：')+(m.kind==='result'&&!sourceCurrent(m.preparation)?'此结果来源已失效，正文隐藏。':m.text)).join('\n\n'),usage:'未上报实际费用 · 无真实调用',
      events:(s.trace||[]).map(e=>e.type),trace:clone(s.trace||[]),
      preparation:clone(s.preparation||current?.preparation||null),resultPreparation:clone(current?.preparation||null),pendingApproval:!!approval?.pendingReview,approval:clone(approval?{decision:approval.decision||'待确认',contextId:approval.preparation.id,validUntil:approval.preparation.validUntil,inputRevision:approval.preparation.inputRevision}:null),approvalHistory:clone(s.messages.filter(m=>m.kind==='permission').map(m=>({contextId:m.preparation.id,decision:m.decision||'待确认',comment:m.reviewComment||'',pendingReview:!!m.pendingReview,inputRevision:m.preparation.inputRevision,validUntil:m.preparation.validUntil,createdAt:new Date(Date.parse(m.preparation.validUntil)-5*60*1000).toISOString(),preparation:m.preparation}))),binding:clone(s.binding||null),executions:clone(s.executions||[]),resultInputRevision:current?.inputRevision||0,
      resultRevision:s.latestResultRevision||0,verification:clone(s.verification||null),synthetic:true};
    if(JSON.stringify(records.get(record.id))!==JSON.stringify(record)){records.set(record.id,record);recordListeners.forEach(fn=>fn());}
  }
  function artifact(s,m){
    const csv='\uFEFF来源,报表金额_EUR,明细金额_EUR,差额_EUR\n离线合成示例_非业务结果,128450,125920,'+(128450-125920)+'\n';
    return {id:`demo-chat-${s.id}-artifact-${m.resultRevision}`,name:`合成差异示例-结果${m.resultRevision}.csv`,content:csv,
      mime:'text/csv;charset=utf-8',resultRevision:m.resultRevision,contextRef:m.preparation.id,synthetic:true};
  }
  window.ReviewJourney={users,subjectId,subject,event,prepare,planCurrent,sourceCurrent,sync,artifact,
    reject(id,contextRef,reason){return rejectionHandler?rejectionHandler(id,contextRef,reason):{ok:false,reason:'没有可拒绝计划'};},setRejectionHandler(fn){rejectionHandler=fn;},stop(id){return stopHandler?stopHandler(id):{ok:false,reason:'没有可停止的执行'};},setStopHandler(fn){stopHandler=fn;},approve(id,contextRef,comment=''){return approvalHandler?approvalHandler(id,contextRef,comment):{ok:false,reason:'没有待处理的计划'};},setApprovalHandler(fn){approvalHandler=fn;},records:()=>clone([...records.values()]),subscribeRecords(fn){recordListeners.push(fn);},memory:()=>clone(memory),memoryAllowed,
    updateMemory(patch){Object.assign(memory,patch);memory.revision++;emit();},
    integrationChanged(reason){integration.revision++;if(reason==='schema')integration.mcpSchemaRevision++;emit();},integration:()=>clone(integration),
    userChanged(){emit();},subscribe(fn){listeners.push(fn);}
  };
})();
</script>
  <script>/* Code source form simulation. Never connects Git, reads directories or retains token text. */
(() => {
 'use strict';
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const input=(label,key,value)=>`<label class="admin-field">${label}<input data-field="${key}" value="${esc(value)}"></label>`;
 const select=(label,key,value,items)=>`<label class="admin-field">${label}<select data-field="${key}">${items.map(([id,name])=>`<option value="${id}" ${id===value?'selected':''}>${name}</option>`).join('')}</select></label>`;
 const defaults={sourceKind:'git',gitProvider:'gitlab',authMode:'access_token',tokenKind:'personal',username:'oauth2',localPath:'',executionHostRef:'demo-node-1'};
 function editor(x){

  function drawer(x,page,actor){const r=x.r,p=x.a?.preparation||r?.preparation,resources=p?.resources,binding=page==='approvals'?r?.executions?.find(n=>n.contextRef===x.a?.contextId):r?.binding,sample=!!x.example,pending=page==='approvals'&&x.state==='pending',mayApprove=actor==='approver'&&pending;return `<div class="ops-drawer-backdrop"></div><section class="ops-drawer" role="dialog" aria-modal="true" aria-labelledby="ops-detail-title" tabindex="-1"><header><div><span class="ops-kicker">${page==='approvals'?'审批详情':'执行详情'}${sample?' · 示例':''}</span><h2 id="ops-detail-title">${esc(x.title)}</h2></div>${button('close','×',false,'class="ops-close" aria-label="关闭详情"')}</header><div class="ops-drawer-body">${statusTag(x,page)}<dl class="ops-summary"><div><dt>申请人</dt><dd>${esc(x.ownerName)}</dd></div><div><dt>系统 / 环境</dt><dd>${esc(scopeName(x.scope))}</dd></div><div><dt>提交时间</dt><dd>${date(x.createdAt)}</dd></div><div><dt>${page==='approvals'?'审批类型':'执行方式'}</dt><dd>${esc(page==='approvals'?'只读检查':modeNames[p?.executionPolicy?.mode]||'逐次审批')}</dd></div></dl><section class="ops-plan"><h3>本次检查</h3>${p?.approvalSummary?`<div class="ops-request-summary"><strong>问题</strong><p>${esc(p.approvalSummary.question)}</p>${p.approvalSummary.conditions!==p.approvalSummary.question?`<strong>本轮补充</strong><p>${esc(p.approvalSummary.conditions)}</p>`:''}</div>`:''}<p>${esc(sample?x.example.reason:p?.executionPolicy?.reason||'按用户确认的范围检查问题，交付结果后由用户验证。')}</p><ul><li>读取本环境获准的代码、数据和日志</li><li>关联证据并生成核对结果</li><li>不写入业务数据，不修改代码</li></ul></section>${page==='executions'?`<section class="ops-plan"><h3>处理进度</h3><p>${esc(r?.verification?'用户已确认该结果':r?.resultRevision?'结果已交付，等待用户验证':sample?'示例仅展示申请状态，未提交执行。':r?.status||'尚未执行')}</p><p>${r?.binding?.state==='active_simulation'?'当前正在离线模拟执行。':''}</p></section>`:`<p class="ops-hint">${sample?'示例预览：决定仅更新本页状态。':x.state==='policy'?'按已授权只读策略放行，非人工审批。':pending?'批准仅适用于本次固定计划；计划变化后需重新审批。':esc(x.a?.decision||'此事项已处理。')}</p>`}${x.a?.comment?`<div class="ops-approved-comment"><h3>审批意见</h3><p>${esc(x.a.comment)}</p></div>`:''}<details class="ops-technical"><summary>技术详情与审计</summary><dl><dt>会话 / 输入修订</dt><dd>${esc(r?.id||x.id)} / ${esc(x.a?.inputRevision||r?.inputRevision||'示例')}</dd><dt>上下文 / 有效期</dt><dd>${esc(x.a?.contextId||p?.id||'示例快照')} / ${esc(x.a?.validUntil||p?.validUntil||'示例不向后端提交')}</dd><dt>授权依据</dt><dd>${esc(p?.executionPolicy?.policyRef||'示例只读计划')}</dd><dt>固定执行拥有者</dt><dd>${binding?esc(binding.provider+' / '+binding.id+' / '+binding.state):'尚未提交执行'}</dd><dt>资源快照</dt><dd>代码 ${resources?.projects.length||0} / MCP ${resources?.mcps.length||0} / Skill ${resources?.skills.length||0}</dd></dl><p>${esc(JSON.stringify({resources:resources||'示例',context:p?.id,actualModel:'unknown'}))}</p><h3>历次节点执行</h3><ol>${(r?.executions||[]).map(n=>`<li>${esc(n.id)} · 输入 ${n.inputRevision} · ${esc(n.state)} · 结果 ${n.resultRevision||'未交付'}</li>`).join('')||'<li>尚未创建执行</li>'}</ol><h3>操作记录</h3><ol>${(r?.events||[x.example?.decision||'合成待办，仅用于页面预览']).map(e=>`<li>${esc(e)}</li>`).join('')}</ol></details>${pending?`<label class="admin-field">审批意见 <span class="ops-optional">选填，拒绝时必填</span><textarea data-ops-field="reason" rows="3" placeholder="填写补充意见或拒绝原因">${esc(reasons[x.key]||'')}</textarea></label>`:''}<p class="ops-inline-feedback" role="status"></p></div><footer class="ops-drawer-footer">${page==='approvals'?`${pending?button('reject','拒绝',!mayApprove,'class="ops-reject"')+button('approve','批准',!mayApprove,'class="admin-primary"'):button('dismiss','关闭')}`:`${r?button('record','查看用户记录'):''}${button('stop','停止执行',actor!=='operator'||r?.binding?.state!=='active_simulation')}`}</footer></section>`;}
  function refresh(){window.ServiceDesignPrototype.render(root.dataset.servicePage);}

  function permissions(x){const d=C.draft();return `${window.ContextQuota.globalEditor(d)}<h2>${esc(x.name)}的使用范围</h2><h3>系统与环境</h3><div class="admin-check-grid">${d.environments.map(env=>`<label class="admin-check"><input type="checkbox" data-grant="environments" value="${env.id}" ${x.environments.includes(env.id)?'checked':''}>${esc(d.systems.find(s=>s.id===env.system).name)} / ${esc(env.name)}</label>`).join('')}</div><h3>可用检查流程</h3>${d.workflows.map(w=>`<label class="admin-check"><input type="checkbox" data-grant="workflowIds" value="${w.id}" ${(x.workflowIds||[]).includes(w.id)?'checked':''}>${esc(w.name)}</label>`).join('')}<h3>可选模型</h3>${d.models.map(m=>`<label class="admin-check"><input type="checkbox" data-grant="models" value="${m.id}" ${x.models.includes(m.id)?'checked':''}>${esc(m.name)}</label>`).join('')}<h3>资料访问</h3>${toggle('添加附件','attachments',x.attachments,'原型只展示文件名；正式上传和内容读取分别鉴权。')}${toggle('下载检查文件','download',x.download,'对每份产物重新鉴权；本页仅配置和预览。')}${toggle('查看本人历史对话','history',x.history,'不包含他人的会话。原型未接入真实身份。')}${toggle('查看执行事件','events',x.events,'事件与诊断不是公开数据；本页仅配置和预览。')}<h3>执行方式、审批与用量</h3>${select('角色默认执行方式','executionMode',x.executionMode||'confirm',window.ResourceDesign.modes)}${toggle('允许用户获配自动只读检查','allowAutoRead',x.allowAutoRead,'仍受环境、资源和预算约束；不是任意自动执行。')}${toggle('允许确认本人会话的只读计划','canApproveRead',x.canApproveRead,'不包含写入或替他人批准；未授权时交由责任人。')}${text('审批责任人','approver',x.approver)}<div class="admin-two">${text('角色内部调用目标上限','maxCalls',x.maxCalls,'type="number" min="1" max="100"')}${text('角色并发上限','concurrency',x.concurrency,'type="number" min="1" max="5"')}</div><p class="admin-muted">固定只读策略；具体操作执行前确认。受控写入不在本轮范围。数量与费用需后端落实，这里不声称已硬性限制。</p>`;}
  function workflows(x){const d=C.draft();return `<section class="ops-panel workflow-table"><div class="ops-panel-head"><h2>检查流程</h2><span class="ops-source-label">固定模板 · 应用后供新计划使用</span></div><div class="ops-table-wrap"><table class="ops-table"><thead><tr><th>流程名称</th><th>适用检查</th><th>状态</th><th>依赖</th><th>操作</th></tr></thead><tbody>${d.workflows.map(w=>`<tr><td class="ops-subject"><strong>${esc(w.name)}</strong><small>配置修订 ${w.revision}</small></td><td class="workflow-description">${esc(w.purpose)}</td><td><span class="ops-status ${w.enabled?'success':'muted'}">${w.enabled?'已启用':'已停用'}</span></td><td>${w.skillIds.length} 项 Skill · ${String(w.tools).split(',').filter(v=>v.trim()).length} 项只读工具</td><td>${`<button type="button" data-record="${w.id}" class="ops-link">配置</button>`}</td></tr>`).join('')}</tbody></table></div></section>${workflowOpen?`<section class="admin-editor"><div class="admin-form"><h2>${esc(x.name)} · 流程配置</h2>${text('流程名称','name',x.name)}${text('检查目标','purpose',x.purpose)}<div class="workflow-chain"><span>补齐条件</span><i>→</i><span>授权 / 审批</span><i>→</i><span>只读取证</span><i>→</i><span>交付待验证</span></div><h3>所需只读工具</h3>${d.mcps.flatMap(m=>String(m.tools).split(',').map(t=>t.trim()).filter(Boolean).map(t=>`<label class="admin-check"><input type="checkbox" data-flow-tool="${esc(m.id+'::'+t)}" ${String(x.tools).split(',').map(v=>v.trim()).includes(m.id+'::'+t)?'checked':''}>${esc(m.name)} / ${esc(t)}</label>`)).join('')}<h3>检查方法</h3>${d.skills.map(skill=>`<label class="admin-check"><input type="checkbox" data-grant="skillIds" value="${skill.id}" ${(x.skillIds||[]).includes(skill.id)?'checked':''}>${esc(skill.name)}</label>`).join('')}${toggle('需要读取代码','readCode',x.readCode)}${toggle('开放此检查流程','enabled',x.enabled)}<p class="admin-muted">模型取用户获准的预设；工具和 Skill 必须同时被目标环境允许。流程不增加资源权限。</p></div></section>`:'<section class="workflow-overview"><p>选择“配置”查看该流程。用户仍通过对话提问，不需要自己编排步骤。</p></section>'}`;}
  function preview(){const v=C.visible(C.draft()),rows=[['系统',v.systems.map(x=>x.name).join('、')||'无可用系统'],['环境',v.environments.map(x=>x.name).filter((x,i,a)=>a.indexOf(x)===i).join('、')||'无可用环境'],['模型',v.models.map(x=>x.name).join('、')||'无可用模型'],['附件',v.role.attachments?'允许添加':'不可添加'],['文件下载',v.role.download?'允许（仍需逐项授权）':'不允许'],['历史 / 事件',`${v.role.history?'本人历史':'不提供历史'} / ${v.role.events?'允许事件':'不提供事件'}`]];return `<h2>用户端预览</h2><label class="admin-field">预览身份<select id="admin-preview-role">${C.draft().roles.map(r=>`<option value="${r.id}" ${C.role()===r.id?'selected':''}>${r.name}</option>`).join('')}</select></label><p class="admin-muted">下方展示草稿效果。对话读取已应用配置；身份切换仅用于离线评审。</p><dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl><a class="admin-preview-link" href="#chat">返回用户对话 ↗</a><div class="admin-note">用户只选择已配置、已获权限的选项，无需理解后端或权限规则。</div>`;}
  function render(next=page,focus=false){
    if(window.ServiceDesignPrototype?.has(next)){window.ServiceDesignPrototype.render(next,focus);return;}
    root.dataset.mode='configuration';page=pages[next]?next:'systems';const d=C.draft();if(!selected())selections[page]=d[group()][0].id;const x=selected(),items=page==='environments'?d.environments.filter(e=>e.system===x.system):d[group()];
    root.innerHTML=window.ServiceDesignPrototype.managementHeader()+window.ServiceDesignPrototype.navigation(page)+`<main class="admin-main"><header class="admin-heading"><div><div class="admin-eyebrow">${page==='environments'?`<button type="button" data-parent-system="${x.system}">系统设置</button> / ${esc(d.systems.find(sys=>sys.id===x.system)?.name)} / 环境`:'平台管理 / 对话配置'}</div><h1 tabindex="-1">${pages[page][0]}</h1><p>${pages[page][1]}</p></div><span class="admin-badge">合成配置管理员</span></header><div class="admin-toolbar"><span id="admin-draft-status"></span><div>${btn('discard','放弃当前草稿')}${btn('publish-set','选择变更集')}${btn('publish','预览并应用当前对象','admin-primary')}</div></div><div id="admin-feedback" role="status" aria-live="polite">${esc(notice)}</div><div id="admin-validation"></div>${page==='workflows'?workflows(x):`<div class="admin-columns"><section class="admin-editor">${page==='environments'?`<label class="admin-field system-scope-picker">当前系统<select id="environment-system-filter">${d.systems.map(sys=>`<option value="${sys.id}" ${sys.id===x.system?'selected':''}>${esc(sys.name)}</option>`).join('')}</select></label>`:''}<div class="admin-records" aria-label="配置记录">${page!=='permissions'?btn('add','＋ 新增'): ''}${items.map(i=>`<button data-record="${i.id}" ${i.id===x.id?'aria-pressed="true"':''}>${esc(page==='environments'?d.systems.find(s=>s.id===i.system).name+' / '+i.name:i.name)}${i.enabled===false?'<span>已停用</span>':''}</button>`).join('')}</div><div class="admin-form">${page==='resources'&&resourceReturn?`<button type="button" data-admin="return-environment" class="config-return">← 返回 ${esc(resourceReturn.name)} 环境配置</button>`:''}${({systems,environments,models,permissions,resources})[page](x)}</div></section><aside class="admin-preview">${preview()}</aside></div>`}<details class="admin-audit"><summary>本次演示的配置记录（${C.audit().length}）</summary>${C.audit().length?C.audit().map(a=>`<p>配置修订 ${a.revision} · ${esc(a.actor)} · ${esc(a.at)}<br>${esc(a.changes.join('；'))}</p>`).join(''):'<p>暂无应用记录。草稿尚未影响用户对话。</p>'}</details></main><dialog id="admin-dialog" aria-labelledby="admin-dialog-title"></dialog>`;
    updatePreview();if(focus)root.querySelector('h1').focus();if(pendingFocus){const issue=pendingFocus;pendingFocus=null;focusField(issue);}
    root.querySelector('#admin-dialog').addEventListener('cancel',()=>setTimeout(()=>trigger?.focus(),0));
  }
  function focusField(issue){if(issue.type==='quotaDefaults'){const detail=root.querySelector('.admin-details');if(detail)detail.open=true;root.querySelector('[data-quota-default]')?.focus();return;}const el=root.querySelector(`[data-field="${issue.field}"],[data-grant="${issue.field}"]`);if(el){el.setAttribute('aria-invalid','true');el.setAttribute('aria-describedby','admin-validation');el.focus();el.scrollIntoView({block:'center'});}}
  function renderIssues(){const target=root.querySelector('#admin-validation');if(!issuesShown){target.innerHTML='';return;}const issues=C.issues(),d=C.draft();target.innerHTML=issues.length?`<section class="config-validation" aria-label="需要修正的配置"><strong>${issues.length} 处需要修正</strong><ul>${issues.map((x,i)=>`<li><span>${esc(d[x.type].find(y=>y.id===x.id)?.name||x.id)}：${esc(x.message)}</span><button type="button" data-admin="locate" data-issue="${i}">前往修正 →</button></li>`).join('')}</ul></section>`:'';for(const el of root.querySelectorAll('[aria-invalid]')){el.removeAttribute('aria-invalid');el.removeAttribute('aria-describedby');}for(const x of issues)if(x.id===selections[page]){const el=root.querySelector(`[data-field="${x.field}"],[data-grant="${x.field}"]`);if(el)el.setAttribute('aria-invalid','true');}}

  function go(target,issue=null){pendingFocus=issue;if(location.hash==='#admin-'+target)render(target);else location.hash='admin-'+target;}
  root.addEventListener('input',e=>{if(root.dataset.mode==='service')return;if(e.target.dataset.quotaDefault){C.draft().quotaDefaults[0][e.target.dataset.quotaDefault]=e.target.value===''?null:Number(e.target.value);updatePreview();return;}if(e.target.dataset.projectRef){const x=selected();x.projectRefs??={};x.projectRefs[e.target.dataset.projectRef]=e.target.value;updatePreview();return;}if(!e.target.dataset.field||e.target.type==='checkbox'||e.target.tagName==='SELECT')return;const value=e.target.type==='number'?Number(e.target.value):e.target.value;selected()[e.target.dataset.field]=value;updatePreview();});
  root.addEventListener('change',e=>{if(e.target.id==='quota-hard-required'){C.draft().quotaDefaults[0].hardModelLimits=e.target.checked;updatePreview();return;}if(root.dataset.mode==='service'||e.target.dataset.projectRef||e.target.dataset.quotaDefault||e.target.id==='code-access-token')return;

    if(e.target.dataset.flowTool){const values=String(selected().tools).split(',').map(v=>v.trim()).filter(Boolean),ref=e.target.dataset.flowTool;selected().tools=(e.target.checked?[...new Set([...values,ref])]:values.filter(x=>x!==ref)).join(', ');updatePreview();return;}
    if(e.target.dataset.field&&e.target.type!=='checkbox'&&e.target.tagName!=='SELECT')return;
    const x=selected();
    if(e.target.dataset.field){x[e.target.dataset.field]=e.target.type==='checkbox'?e.target.checked:e.target.value;if(e.target.dataset.field==='connectionId'){const a=C.draft().agentConnections.find(a=>a.id===x.connectionId);x.provider=a.provider;x.agentId=a.agentId;x.agent=a.name;x.quotaModelId=a.catalog.includes(x.quotaModelId)?x.quotaModelId:a.catalog[0]||'';}if(e.target.dataset.field==='provider'){x.agent=x.provider==='control'?'示例 Agent A':'示例 Agent B';x.connectionId='demo-'+x.provider;x.agentId='demo-agent-'+x.provider;}}

  });
  root.addEventListener('click',e=>{if(root.dataset.mode==='service')return;
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.admin==='review-mcp'&&page==='resources'&&resourceType==='mcps'){const x=selected();x.reviewFingerprint=window.ResourceDesign.mcpFingerprint(x);notice='仅确认填写的合成工具范围；未发现真实工具、未连接 MCP。';render();return;}

  function refreshHistory(s){const node=root.querySelector('[data-chat="session"][data-id="'+s.id+'"] .chat-history-state');if(node)node.textContent=userStatus(s);}
  function runnable(s,p){
    if(denied(s))return false;
    if(!p)return C.understandingPolicy(s).allowed;
    if(s.phase!=='executing')return J.planCurrent(s,p)&&C.understandingPolicy(s).allowed;
    if(s.binding?.state==='queued_simulation')return J.planCurrent(s,p)&&!C.executionAccess(s,p)&&!['blocked','collect_only'].includes(C.executionPolicy(s).mode);

  }

      const handle=setTimeout(()=>{replyTimers.delete(id);s.busy=false;s.queued=false;if(runnable(s,preparation))fn();else{if(s.binding?.contextRef===preparation?.id)s.binding.state='stopped_simulation';s.phase='details';J.event(s,'权限或上下文变化，本地模拟停止；真实在途执行需核查');s.messages.push({role:'assistant',text:'范围、权限或上下文已变化，已停止本次模拟回复。'});}J.sync(s);if(currentId===id)render(false);else refreshHistory(s);drainReplies();},650);

  function startInspection(s,m,authority='user'){if(!m.preparation?.flowDecision?.configured||!J.planCurrent(s,m.preparation)||['blocked','collect_only'].includes(m.preparation.executionPolicy.mode)){s.phase='blocked';s.messages.push({role:'assistant',text:'当前流程、权限或依赖已变化，请重新确认检查范围。'});J.sync(s);return;}m.pendingReview=false;s.topic=m.preparation.flowDecision.workflowId==='interface'?'接口':m.preparation.flowDecision.workflowId==='logs'?'日志':'报表';s.phase='executing';m.decision=authority==='reviewer'?'负责人已批准本计划':authority==='policy'?'自动只读策略已命中':'已允许本次示例检查';J.event(s,authority==='policy'?'已引用自动只读策略（合成）':authority==='reviewer'?'负责人已批准固定计划（合成）':'当前计划已确认（合成）');s.binding={id:m.preparation.plannedBindingId,provider:m.preparation.provider,state:'active_simulation',actualExecution:'not_run',inputRevision:s.inputRevision,authority,contextRef:m.preparation.id,preparationSnapshot:m.preparation,policyRef:m.preparation.executionPolicy.policyRef,resourceConfigurationRevision:m.preparation.resources.configurationRevision};s.executions??=[];s.executions.push(s.binding);J.event(s,'唯一绑定已建立：'+s.binding.id);reply(s,()=>{s.latestResultRevision++;if(s.binding){s.binding.state='terminal_simulation';s.binding.resultRevision=s.latestResultRevision;}J.event(s,'产物已就绪，结果待用户验证（合成）');s.messages.push({role:'assistant',kind:'result',resultRevision:s.latestResultRevision,inputRevision:s.inputRevision,preparation:m.preparation,text:'示例检查已完成，等待你验证。\n\n演示结论：'+(s.topic==='接口'?'先核对请求参数、响应码和同一时点的服务日志，缩小异常范围。':s.topic==='日志'?'先按发生时间与请求标识关联日志，区分首个异常和后续连带错误。':'报表与明细使用的筛选范围可能不同，建议先对齐时间范围与状态条件，再核对差异。')+'\n\n这是一条合成结果，用于评审对话流程；没有读取实际数据，也没有生成真实证据。'});s.phase='result';},m.preparation);}

rd"><h2>3. 分配范围，开始检查</h2><p>权限管理员在成员列表打开此用户，选择角色、环境和执行方式，再开通。申请人不能自行获得权限。</p><div class="onboarding-links"><a href="#admin-users">去用户与权限</a>${active?'<a href="#chat" class="admin-primary">进入对话</a>':'<span class="admin-muted">开通后可进入有权限的对话范围</span>'}</div>${active?`<p>已授予 ${u.scopes?.length||0} 个环境；模型与流程仍取已发布配置的交集。后台配置完整不等于真实执行已就绪。</p>`:''}</section><p id="onboarding-feedback" role="status" aria-live="polite">${esc(notice)}</p><details><summary>正式部署与真实试验的验收条件</summary><p>首次管理员由部署负责人通过一次性受控引导绑定已验证身份；优先复用现有身份源，无企业 SSO 时也可采用受控邀请的成熟身份服务，首版只实施一种登录路径，完成后关闭引导入口；普通申请不得获得管理员角色。服务器重启恢复、真实登录、MCP / ACP 权限与结果真实性须单独验收。</p><p>本页只演示成员开通和现有对话的联动，刷新清空，不构成账号或部署服务。</p></details></main>`;

    return '<div class="state-grid">'+values.map(([name,value])=>'<div class="state-cell"><small>'+name+'</small><strong>'+esc(labels[value]||value)+'</strong><br><code>'+esc(value)+'</code></div>').join('')+'</div>';
  }
  function events() {
    return state.events.length?state.events.slice(-8).reverse().map(x=>'<div class="event"><span class="event-index">'+String(x.sequence).padStart(2,'0')+'</span><div>'+esc(x.message)+'<div class="help">'+esc(x.source)+'</div></div></div>').join(''):'<div class="empty">暂无执行事件。空记录不证明外部未发生执行。</div>';
  }
  function bindingInfo() {
    const b=state.binding,c=M.connections[b.provider];
    return kv([['执行拥有者',c.label+' / '+c.agent],['Binding',b.id],['NodeRun',b.nodeRunId],['连接 revision',b.connectionRevision],['外部运行引用',b.externalRef || '尚未确认'],['演示执行活跃',b.executionActive],['副作用',b.effectStatus],['拥有权占用',b.ownerOccupied?'保留':'未占用/已安全关闭'],['模型请求',c.model+'（合成）'],['实际模型确认','未知，未启动真实 Agent'],['下次默认连接',M.connections[state.defaultProvider].label]]);
  }
  function workbench() {
    const b=state.binding;
    return states()+'<div class="grid"><div class="stack">'+card('德国成交金额与导出明细不一致','<p class="muted">先补齐报表时间、时区、订单状态与币种；获得可核对证据后再交付结果。</p><div class="steps"><span class="step done">1 提出问题</span><span class="step '+(state.conditions?'done':'')+'">2 补齐条件</span><span class="step '+(b.externalRef?'done':'')+'">3 授权取证</span><span class="step '+(state.results.length?'done':'')+'">4 结果与验证</span></div><label for="conditions">报表范围、时区、状态与币种</label><textarea id="conditions" placeholder="例如：10 月 1–24 日，UTC+8，已完成订单，EUR">'+esc(state.conditions || '')+'</textarea>'+actions(btn('conditions','保存条件',state.run==='draft','primary')+btn('start','模拟接收并执行',state.node==='ready')+btn('start_timeout','模拟提交无响应',state.node==='ready'))+'<div class="help">实际能力均未验收；这里仅推进内存中的合成状态。</div>')+card('执行过程',events()+actions(btn('complete','模拟执行完成',['active','stopping'].includes(b.state))+btn('cancel','请求停止',['active','waiting_permission','reconciling'].includes(b.state))+btn('confirm_cancel','模拟停止确认',b.state==='stopping')+btn('request_approval','模拟受限导出请求',b.state==='active'&&!state.approval)))+'</div><div class="stack">'+card('当前上下文',bindingInfo(),'tint')+card('交付门槛','<ul class="checklist"><li>部署与代码版本一致</li><li>报表区间、取数时点与水位可比较</li><li>产物完整性和下载权限已检查</li><li>运行成功后仍需用户确认</li></ul><a href="#result">查看结果与验证 →</a>')+'</div></div>';
  }
  function resultPage() {
    const ready=state.issue==='awaiting_verification' && state.evidenceConsistent && state.artifact==='verified';
    const rows=state.results.map(x=>'<tr><td>结果 #'+x.revision+'</td><td>'+esc(x.bindingId)+'</td><td>'+esc(x.verifiedBy||'未确认')+'</td><td>'+esc(x.conclusion)+'</td></tr>').join('');
    return '<div class="banner">以下金额、查询区间、版本及文件均为内置合成示例，未解析用户材料或查询数据库。</div><div class="grid"><div class="stack">'+card('结论与有效范围',state.results.length?'<div class="between"><span class="result-amount">2,530 <small>EUR</small></span>'+tag(state.evidenceConsistent?'合成结论可复核':'证据不一致',!state.evidenceConsistent)+'</div><p>示例报表与明细采用不同订单状态口径。该结论仅适用于内置样例。</p>':'<div class="empty">本轮尚无新结果；已有历史结果会继续保留。</div>')+card('可定位证据',kv([['部署 / 代码',state.evidenceConsistent?'demo-deploy-1025 / demo-deploy-1025':'demo-deploy-1025 / demo-other'],['查询区间','2026-10-01T00:00:00+08:00 ≤ t < 2026-10-25T00:00:00+08:00'],['数据库取数时点','2026-10-25T06:00:00Z（合成）'],['报表水位','2026-10-25T05:55:00Z；示例延迟 5 分钟'],['来源定位','synthetic_report / sheet=德国 / rows=2–4'],['完整性',labels[state.artifact]||state.artifact]]))+card('结果历史','<div class="table-wrap"><table><thead><tr><th>版本</th><th>来源绑定</th><th>用户确认</th><th>结论</th></tr></thead><tbody>'+rows+'</tbody></table></div>')+'</div><div class="stack">'+card('用户验证','<p>执行成功只代表分析完成。请针对当前结果版本确认问题是否解决。</p>'+tag(state.issue)+actions(btn('verify','确认本结果已解决',ready,'primary')+btn('new_round','仍有问题 / 新一轮',M.safeClosed(state)))+'<div class="help">重开会保留旧结果。未知执行仍占用时禁止创建替代执行。</div>')+card('文件与接管','<p>产物状态：'+tag(state.artifact,state.artifact==='failed')+'</p>'+actions(ui('download-sample','下载合成差异样例')+ui('download-handoff','下载合成接管包'))+'<p class="help">下载前会重新检查当前模拟状态。真实 ACL、计算和文件导入尚未接入。</p>')+'</div></div>';
  }
  function connectionsPage() {
    return '<div class="banner">两条连接只做结构演示。真实连接健康、Agent 能力与模型确认均为未知；不会发起探测。</div><div class="grid"><div class="stack">'+Object.entries(M.connections).map(([id,c])=>card(c.label,'<div class="between"><span class="muted">'+c.agent+'</span>'+tag('实际未验收',true)+'</div><div class="separator"></div>'+kv([['连接标识','demo-'+id],['配置 revision',3],['Agent / 模型',c.agent+' → '+c.model],['能力观察','实际：unknown；演示数据：内置'],['审批桥接',c.bridge?'模拟宿主支持，实际未验收':'已查源码缺少完整外部审批桥接'],['二进制产物',id==='control'?'当前入口仅元数据，需适配导入':'模拟有导入步骤，实际未验收'],['实际隔离/预算','unknown，worktree 不等于 OS 沙箱']])+'<div class="actions"><button data-default="'+id+'">设为下次默认连接</button></div>',state.binding.provider===id?'tint':'')).join('')+'</div>'+card('绑定规则','<p>当前 Binding：<code>'+esc(state.binding.id)+'</code></p><p>当前拥有者：<strong>'+esc(M.connections[state.binding.provider].label)+'</strong></p><p>下次默认：'+esc(M.connections[state.defaultProvider].label)+'</p><ul class="checklist"><li>默认修改只影响新节点</li><li>接纳未知时先核查原键</li><li>原执行安全关闭后才可创建新绑定</li><li>能力未知/不匹配时拒绝真实启动</li></ul><a href="#binding">查看当前绑定 →</a>')+'</div>';
  }
  function bindingPage() {
    const b=state.binding, unknown=b.state==='acceptance_unknown';
    return states()+'<div class="grid"><div class="stack">'+card('唯一执行拥有者',bindingInfo(),'tint')+card('提交与断线核查','<p class="muted">查不到记录并不能排除延迟接纳。必须找到原回执，或证明旧提交永久不能接纳。</p>'+actions(btn('lookup_not_found','模拟查询：not_found',unknown)+btn('lookup_found','模拟找到原回执',unknown,'primary')+btn('close_final','模拟最终封闭原提交',unknown))+actions(btn('disconnect','模拟连接离线',['active','waiting_permission','stopping'].includes(b.state))+btn('reconcile_active','模拟原拥有者快照恢复',b.state==='reconciling')+btn('new_round','安全关闭后新一轮',M.safeClosed(state)))+'<div class="help">最终封闭证明：'+esc(b.admissionFence||'尚无')+'。这些回执均为合成示例。</div>')+'</div><div class="stack">'+card('事件与水位',events()+actions(btn('duplicate_event','模拟重复事件')))+card('预算与停止',kv([['真实费用','未上报'],['演示估算','18 内部积分；不等同实际费用'],['新调用门禁',state.usageBlocked?'阻断':'仅允许合成计数'],['合成新调用数',state.modelCalls+' / 2'],['start 发送数',state.startCommands],['停止状态',labels[b.state]||b.state]])+actions(btn('billable_step','模拟一次新增调用',b.state==='active'&&!state.usageBlocked)+btn('usage_unknown','模拟用量未知'))+'<p class="help">调用次数限制不证明供应商金额硬阻断。未知预算保持挂账。</p>')+'</div></div>';
  }
  function approvalPage() {
    const a=state.approval;
    if(!a)return card('暂无权限请求','<div class="empty">先加载“审批与安全恢复”演示路径，或在原执行中模拟受限导出请求。</div>');
    const bridge=M.connections[state.binding.provider].bridge;
    return '<div class="banner">批准固定的合成文件导出计划。原生请求没有统一固定超时；本页手动模拟请求失效，不运行 SQL 或写入。</div><div class="grid"><div class="stack">'+card('固定操作与范围',kv([['动作','导出合成差异文件；仅测试环境'],['operationId',a.operationId],['获审计划哈希',a.planHash],['当前计划哈希',state.currentPlanHash],['目标集合','合成订单 3 条；字段仅国家和金额'],['前置状态',a.preconditionsMatch?'合成数据 revision=7 已核对':'已漂移，需要重新取证'],['批准有效性',a.valid?'演示逻辑时钟：有效':'演示逻辑时钟：已过期'],['资源权限','仅合成样例；真实资源无授权'],['审批桥接',bridge?'模拟支持，实际未知':'当前连接不支持完整审批桥接']]))+card('业务决定','<div class="between">'+tag(a.decision,a.decision!=='approved')+'<code>'+esc(a.id)+'</code></div><label class="check"><input type="checkbox" id="approval-check" '+(formDrafts.approvalId===a.id&&formDrafts.checked?'checked':'')+'>我已审阅当前计划、影响范围、前置条件与有效期。</label><label for="approval-comment">审批意见（拒绝必填）</label><input type="text" id="approval-comment" value="'+esc(formDrafts.approvalId===a.id?formDrafts.comment:a.comment)+'" placeholder="请输入审批意见">'+actions(btn('approve','保存业务批准',a.decision==='pending','primary')+btn('deny','拒绝本计划',a.decision==='pending')))+'<section class="card"><h2>历史审批</h2>'+(state.approvalHistory.length?state.approvalHistory.map(h=>'<p><code>'+esc(h.id)+'</code> '+tag(h.decision,true)+' → <code>'+esc(h.requestId)+'</code></p>').join(''):'<div class="empty">尚无历史决定。恢复后保留旧记录。</div>')+'</section></div><div class="stack">'+card('权限送达与动作结果',kv([['原生 requestId',a.requestId],['映射 revision',a.mappingRevision],['请求有效',a.requestLive?'合成请求仍有效':'已失效 / 不可重放'],['响应送达',labels[a.delivery]||a.delivery],['动作结果',labels[a.action]||a.action],['权限发送次数',state.permissionSends],['已核验动作次数',state.operationsExecuted]])+actions(btn('send_permission','模拟发送权限响应',a.decision==='approved'&&a.delivery==='ready'&&bridge,'primary')+btn('send_timeout','模拟响应送达未知',a.decision==='approved'&&a.delivery==='ready'&&bridge))+actions(btn('lookup_delivery','核对原决定回执',a.delivery==='delivery_unknown')+btn('operation_receipt','模拟动作核验回执',a.delivery==='delivered'&&!a.consumed)+btn('inner_deny','模拟内层策略拒绝',a.decision==='approved'&&!a.consumed)))+card('失效与安全恢复','<div class="recovery"><p>① 核查原拥有者与未执行证明</p><p>② 保留旧请求和决定</p><p>③ 原 Binding 准备新请求</p><p>④ 新业务审批，再复查，再发送</p></div>'+actions(btn('expire_native','模拟原生请求失效',a.delivery==='ready')+btn('expire_business','模拟业务批准过期',a.delivery==='ready')+btn('drift','模拟前置条件漂移',a.delivery==='ready'))+actions(btn('refresh_plan','模拟重新取证',a.delivery==='stale')+btn('prepare_new_permission','安全准备新请求',a.delivery==='stale')))+'</div></div>';
  }
  function contractPage() {
    const l=window.REVIEW_TABLES.layers[layer];
    const methods=['inspectCapabilities','validateBinding','start','lookupSubmission','closeSubmission','getSnapshot','readEvents','submitInput','cancel','preparePermissionResume','respondPermission','getArtifact'];
    return '<div class="banner">正式数据结构与异常规则保存在设计文档。这里展示设计合同，不代表接口已经实现。</div>'+card('执行契约','<div class="actions compact">'+methods.map(x=>'<code>'+x+'</code>').join('')+'</div><p class="help">同键同哈希复用回执；not_found 不证明未接纳；取消请求不等于停止确认；未知不能换后端重放。</p><a href="../design/EXECUTION-PROVIDER.md">完整合同文档 →</a>')+'<div class="card mt"><div class="between"><h2>分层状态转换</h2><label for="state-layer">选择状态层</label><select id="state-layer" style="max-width:200px">'+Object.entries(window.REVIEW_TABLES.layers).map(([id,x])=>'<option value="'+id+'" '+(id===layer?'selected':'')+'>'+x.label+'</option>').join('')+'</select></div><p class="muted small">未列出的转换拒绝；重复事实只确认，不重复执行。审批决定、送达与动作状态分开。</p><div class="table-wrap"><table><thead><tr><th>ID / 从</th><th>触发 → 到</th><th>责任主体</th><th>守卫</th><th>原子组</th></tr></thead><tbody>'+l.transitions.map(x=>'<tr><td><b>'+x.id+'</b><br>'+esc(x.from.join(' / '))+'</td><td>'+esc(x.event)+'<br>→ '+esc(x.to)+'</td><td>'+esc(x.actor)+'</td><td>'+esc(x.guard)+'</td><td>'+esc(x.atomic)+'</td></tr>').join('')+'</tbody></table></div></div>';
  }
  function exceptionPage() {
    return states()+'<div class="grid"><div class="stack">'+card('当前阻塞与证据','<p>'+esc(state.message)+'</p>'+kv([['能力状态',state.capability==='simulation_only'?'仅合成演示，实际 unknown':state.capability],['用量门禁',state.usageBlocked?'新增计费阻断':'真实费用未上报；仅演示计数'],['证据一致性',state.evidenceConsistent?'合成版本与时点可比':'版本或时点不一致，限制结论'],['产物完整性',labels[state.artifact]||state.artifact],['未知拥有权',state.binding.ownerOccupied?'仍保留，不可替代执行':'无未关闭执行占用']]),'warning')+card('失效路径演示',actions(btn('usage_unknown','用量未上报')+btn('evidence_mismatch','证据版本不一致')+btn('artifact_corrupt','产物完整性失败')+btn('handoff','转人工接管',!['resolved','archived_unconfirmed'].includes(state.issue))))+'</div>'+card('人工接管材料','<ul class="checklist"><li>问题、条件、固定系统环境</li><li>唯一 Binding、外部运行引用、未知接纳和副作用</li><li>审批、原生请求及送达历史</li><li>最后事件水位、证据及文件状态</li><li>预算挂账、下一步核查与负责人</li></ul><p>接管责任人：<strong>合成测试负责人</strong></p><p class="help">接管不会清除未决拥有权。包仅包含合成材料，真实导出仍须逐项授权。</p>'+actions(ui('download-handoff','下载合成接管包')) )+'</div>';
  }
  function render(focus=false) {
    const onboarding=route==='getting-started';
    document.querySelector('#onboarding-root').hidden=!onboarding;
    const chat = !route || route === 'chat';
    const admin = route.startsWith('admin-');
    if(!chat)window.ChatPrototype.hide();
    if(route!=='admin-records')window.ServiceDesignPrototype.hide();
    document.querySelector('#configuration-root').hidden=!admin;
    document.querySelector('#chat-root').hidden=!chat;
    document.querySelector('#review-root').hidden=chat||admin||onboarding;
    if(onboarding){window.OnboardingPrototype.render(focus);return;}
    if(admin){window.AdminPrototype.render(route.slice(6),focus);return;}
    if(chat){window.ChatPrototype.render(focus);return;}
    if(!pages[route])route='workbench';
    document.querySelector('#work-nav').innerHTML=link('workbench')+link('result');
    document.querySelector('#admin-nav').innerHTML=['connections','binding','approval','contract','exceptions'].map(x=>link(x)).join('');
    const views={workbench,result:resultPage,connections:connectionsPage,binding:bindingPage,approval:approvalPage,contract:contractPage,exceptions:exceptionPage};
    document.querySelector('#page-header').innerHTML=header();
    document.querySelector('#content').innerHTML=views[route]();
    document.querySelector('#feedback').textContent=state.message;
    if(focus)document.querySelector('#review-root h1').focus();
  }
  function perform(action,payload={}){if(document.querySelector('#approval-comment'))formDrafts={approvalId:state.approval?.id,comment:document.querySelector('#approval-comment').value,checked:document.querySelector('#approval-check').checked};state=M.act(state,action,payload);render();}
  function download(name,content,type) {
    const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  document.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.default){perform('default_provider',{provider:b.dataset.default});return;}
    if(b.dataset.action){perform(b.dataset.action,{text:document.querySelector('#conditions')?.value,checked:document.querySelector('#approval-check')?.checked,comment:document.querySelector('#approval-comment')?.value});return;}
    if(b.dataset.ui==='reset'){resetTrigger=b;document.querySelector('#reset-dialog').showModal();}
    if(b.dataset.ui==='close-reset'){document.querySelector('#reset-dialog').close();resetTrigger?.focus();}
    if(b.dataset.ui==='confirm-reset'){document.querySelector('#reset-dialog').close();state=M.createState(state.scenario);formDrafts={};render(true);}
    if(b.dataset.ui==='download-sample'){
      if(state.artifact!=='verified'||!state.evidenceConsistent||!state.results.length){document.querySelector('#feedback').textContent='下载被阻止：当前产物未核验或证据不一致。';return;}
      download('合成差异样例.csv','\uFEFF国家,报表金额_EUR,明细金额_EUR,差额_EUR,来源\n德国,128450,125920,2530,离线合成示例_非业务结果\n','text/csv;charset=utf-8');
    }
    if(b.dataset.ui==='download-handoff')download('合成人工接管包.json',JSON.stringify({provenance:'offline_synthetic_example_not_business_evidence',responsible:'合成测试负责人',unknowns:'所有真实能力、真实执行、真实费用均未验收',next:'核查原拥有者与外部副作用；禁止静默换后端重放',state},null,2),'application/json');
  });
  document.addEventListener('change',e=>{
    if(e.target.id==='scenario'){state=M.createState(e.target.value);formDrafts={};render(true);}
    if(e.target.id==='state-layer'){layer=e.target.value;render();}
  });
  document.querySelector('#reset-dialog').addEventListener('cancel',()=>setTimeout(()=>resetTrigger?.focus(),0));
  window.addEventListener('hashchange',()=>{route=location.hash.slice(1);render(true);});
  window.__reviewPrototype={getState:()=>JSON.parse(JSON.stringify(state)),act:perform,loadScenario:name=>{state=M.createState(name);formDrafts={};render();}};
  render();
})();
</script>
</body></html>
