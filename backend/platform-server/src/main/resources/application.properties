server.address=127.0.0.1
server.port=${WB_PORT:18080}
spring.datasource.url=${WB_DB_URL}
spring.datasource.username=${WB_DB_USER}
spring.datasource.password=${WB_DB_PASSWORD}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.connection-init-sql=SET time_zone = '+00:00'
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=false
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
server.error.include-message=never
workbench.blob-root=${WB_BLOB_ROOT}
spring.jackson.deserialization.fail-on-unknown-properties=true
