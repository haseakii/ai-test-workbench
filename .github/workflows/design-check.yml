name: Verify immutable design sources

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-design:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify original UTF-8 source hashes
        run: python3 scripts/verify_sources.py
      - name: Check current initial design consistency
        run: python3 scripts/check_initial_design.py
      - name: Check complete design scope references
        run: python3 scripts/audit_design_scope.py
      - name: Check offline simulation constraints
        run: node docs/prototype/tests/model.test.cjs
