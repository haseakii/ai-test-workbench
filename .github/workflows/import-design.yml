name: Import and render design baseline

on:
  push:
    branches: [main]
    paths: ['.design-import/ready.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: design-baseline-import
  cancel-in-progress: false

jobs:
  import-design:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and unpack text-only design snapshot
        shell: python
        run: |
          import base64, hashlib, io, json, lzma, tarfile
          from pathlib import Path, PurePosixPath
          spec = json.loads(Path('.design-import/ready.json').read_text())
          chunks = [Path('.design-import') / name for name in spec['chunks']]
          assert all(p.parent == Path('.design-import') and p.suffix == '.txt' for p in chunks)
          payload = base64.b64decode(''.join(p.read_text().strip() for p in chunks), validate=True)
          assert len(payload) == spec['size_bytes'] and len(payload) < 2000000
          assert hashlib.sha256(payload).hexdigest() == spec['sha256'], 'Import checksum mismatch'
          raw = lzma.decompress(payload, memlimit=268435456)
          assert len(raw) < 12000000
          allowed_roots = {'docs', 'scripts', 'AGENTS.md', 'CONTEXT.md', 'README.md', 'SOURCE_MANIFEST.json'}
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as archive:
              for member in archive.getmembers():
                  p = PurePosixPath(member.name)
                  assert member.isfile() and not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] in allowed_roots, member.name
                  data = archive.extractfile(member).read()
                  data.decode('utf-8')
                  target = Path(*p.parts)
                  assert not target.is_symlink()
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
          print('Verified and unpacked original UTF-8 sources. No model or business resource was called.')
      - name: Verify source snapshots
        run: python scripts/verify_sources.py
      - name: Install document-only rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk libreoffice-writer
          python -m pip install --disable-pip-version-check python-docx playwright
          python -m playwright install --with-deps chromium
      - name: Render prototype screenshots and document reading copies
        run: python scripts/render_design.py
      - name: Commit design documents only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md CONTEXT.md SOURCE_MANIFEST.json docs scripts
          if ! git diff --cached --quiet; then
            git commit -m "docs: import reviewed source baseline and generate design reading copies"
            git push origin HEAD:main
          fi
