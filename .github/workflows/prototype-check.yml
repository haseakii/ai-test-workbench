name: Offline prototype regression
on:
  pull_request:
    paths: ['docs/prototype/**', 'scripts/build_initial_prototype.py', '.github/workflows/prototype-check.yml']
  push:
    branches: [main]
    paths: ['docs/prototype/**', 'scripts/build_initial_prototype.py', '.github/workflows/prototype-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic prototype build and sources
        run: |
          python3 scripts/build_initial_prototype.py
          git diff --exit-code -- docs/prototype/index.html
          python3 scripts/verify_sources.py
          python3 scripts/check_initial_design.py
          node docs/prototype/tests/model.test.cjs
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/prototype-tools" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/prototype-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check synthetic interactions and layouts
        env:
          NODE_PATH: ${{ runner.temp }}/prototype-tools/node_modules
          REVIEW_OUTPUT: ${{ runner.temp }}/prototype-results
        run: node docs/prototype/tests/browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-prototype-results
          path: ${{ runner.temp }}/prototype-results
          retention-days: 14
          if-no-files-found: warn
