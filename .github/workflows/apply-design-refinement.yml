name: Verify and test design refinement
on:
  push:
    branches: [design/usability-refinement-20261025]
    paths: [.github/workflows/apply-design-refinement.yml, .review-fixes.json, 'docs/prototype/**']
permissions:
  contents: write
concurrency:
  group: design-refinement-transfer
  cancel-in-progress: false
jobs:
  refinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply bounded regression alignment
        shell: python
        run: |
          import hashlib, json, pathlib
          root=pathlib.Path.cwd()
          manifest=root/'.review-fixes.json'
          if not manifest.exists():
              print('Alignment already applied; run tests only.')
              raise SystemExit(0)
          assert manifest.stat().st_size<20000
          data=json.loads(manifest.read_text())
          allowed={'docs/prototype/tests/flow-links-checks.cjs','docs/prototype/tests/execution-resource-checks.cjs','docs/prototype/tests/usability-checks.cjs'}
          changes=[]
          for item in data['files']:
              assert item['path'] in allowed
              p=root/item['path']
              assert not p.is_symlink()
              text=p.read_text()
              assert hashlib.sha256(text.encode()).hexdigest()==item['before'],item['path']
              for before,after in item['replacements']:
                  assert text.count(before)==1, before
                  text=text.replace(before,after)
              assert hashlib.sha256(text.encode()).hexdigest()==item['after'],item['path']
              changes.append((p,text))
          for p,text in changes: p.write_text(text,encoding='utf-8',newline='\n')
          manifest.unlink()
          print('Aligned',len(changes),'test files; no runtime behavior changed.')
      - name: Rebuild and validate offline sources
        run: |
          python3 scripts/build_initial_prototype.py
          python3 scripts/verify_sources.py
          python3 scripts/check_initial_design.py
          python3 scripts/audit_design_scope.py
          node docs/prototype/tests/model.test.cjs
          find docs/prototype -name '*.js' -o -name '*.cjs' | while read file; do node --check "$file"; done
      - name: Commit verified regression alignment on review branch only
        run: |
          test "$GITHUB_REF_NAME" = 'design/usability-refinement-20261025'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'test: align scoped publication and queued execution assertions'
            git push origin HEAD:design/usability-refinement-20261025
          fi
      - name: Install fixed browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/refinement-tools" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/refinement-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run all synthetic browser regressions
        env:
          NODE_PATH: ${{ runner.temp }}/refinement-tools/node_modules
          REVIEW_OUTPUT: ${{ runner.temp }}/refinement-results
        run: node docs/prototype/tests/browser-check.cjs
      - name: Export reviewed source and results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/refinement-results"
          git archive --format=zip --output="$RUNNER_TEMP/refinement-results/review-source.zip" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/refinement-results/source-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refinement-results
          path: ${{ runner.temp }}/refinement-results
          retention-days: 5
          if-no-files-found: error
